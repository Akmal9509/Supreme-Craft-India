<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | Supreme Craft India</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .admin-panel {
            padding: 60px 20px;
        }

        .admin-box {
            max-width: 1100px;
            margin: auto;
        }

        .admin-box form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-box input,
        .admin-box select,
        .admin-box textarea {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .admin-box button {
            cursor: pointer;
        }

        #imagePreviews {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0 25px;
        }

        .preview-item {
            position: relative;
            width: 120px;
        }

        .preview-item img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .preview-number {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #111;
            color: white;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 12px;

            display: flex;

            padding: 18px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;

            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }

        .admin-product-info {
            flex: 1;
        }

        .admin-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            color: white;
        }

        .edit-btn {
            background: #222;
        }

        .delete-btn {
            background: #c00;
        }

        #editBox {
            display: none;
            margin-top: 40px;
            padding: 25px;
            border: 2px solid #222;
            border-radius: 12px;
            background: #fafafa;
        }

        #editPhotoContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .edit-photo {
            width: 160px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        .edit-photo img {
            width: 140px;
            height: 105px;
            object-fit: cover;
            border-radius: 6px;
        }

        .edit-photo button {
            width: 100%;
            border: none;
            padding: 8px;
            margin-top: 7px;
            border-radius: 5px;
            color: white;
        }

        .change-photo-btn {
            background: #222;
        }

        .remove-photo-btn {
            background: #c00;
        }

        .add-photo-btn {
            background: #168000;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .save-edit-btn {
            background: #111;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            margin-top: 25px;
        }

        .cancel-edit-btn {
            background: #777;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            margin-top: 25px;
            margin-left: 8px;
        }

        .status-message {
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            display: none;
        }

        @media(max-width:700px) {

            .admin-product {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-product-main-image {
                width: 100%;
                height: 200px;
            }

            .edit-photo {
                width: 100%;
            }

            .edit-photo img {
                width: 100%;
                height: 180px;
            }

        }

    </style>

</head>

<script>


// ==================================================
// GET IMAGE AS BASE64
// ==================================================

function fileToBase64(file) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                function() {

                    reject(
                        reader.error
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}



// ==================================================
// IMAGE PREVIEW
// ==================================================

const imageInput =
    document.getElementById(
        "productImages"
    );


const imagePreviews =
    document.getElementById(
        "imagePreviews"
    );


imageInput.addEventListener(
    "change",
    function() {

        imagePreviews.innerHTML = "";


        const files =
            Array.from(
                this.files
            );


        if (files.length > 10) {

            alert(
                "Maximum 10 photos allowed."
            );

            this.value = "";

            return;
        }


        files.forEach(
            function(file, index) {

                const reader =
                    new FileReader();


                reader.onload =
                    function(event) {

                        imagePreviews.innerHTML += `

                            <div class="preview-item">

                                <span class="preview-number">
                                    ${index + 1}
                                </span>

                                <img
                                    src="${event.target.result}"
                                >

                            </div>

                        `;

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );

    }
);



// ==================================================
// ADD PRODUCT TO FIRESTORE
// ==================================================

document
.getElementById("productForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const files =
            Array.from(
                imageInput.files
            );


        if (files.length === 0) {

            alert(
                "Please select at least one photo."
            );

            return;
        }


        if (files.length > 10) {

            alert(
                "Maximum 10 photos allowed."
            );

            return;
        }


        try {

            showStatus(
                "Uploading product...",
                false
            );


            // Convert photos

            const images =
                await Promise.all(
                    files.map(
                        fileToBase64
                    )
                );


            const product = {

                name:
                    document
                    .getElementById(
                        "productName"
                    )
                    .value
                    .trim(),


                price:
                    Number(
                        document
                        .getElementById(
                            "productPrice"
                        )
                        .value
                    ),


                category:
                    document
                    .getElementById(
                        "productCategory"
                    )
                    .value,


                images:
                    images,


                image:
                    images[0],


                description:
                    document
                    .getElementById(
                        "productDescription"
                    )
                    .value
                    .trim(),


                stock:
                    Number(
                        document
                        .getElementById(
                            "productStock"
                        )
                        .value
                    ),


                createdAt:
                    new Date().toISOString()

            };


            await window.firebaseAddDoc(

                window.firebaseCollection(
                    window.firebaseDB,
                    "products"
                ),

                product

            );


            alert(
                "✅ Product Firestore me successfully add ho gaya!"
            );


            document
            .getElementById(
                "productForm"
            )
            .reset();


            imagePreviews.innerHTML =
                "";


            showAdminProducts();


            showStatus(
                "Product successfully added.",
                false
            );


        }

        catch(error) {

            console.error(
                error
            );


            alert(
                "❌ Product add nahi hua.\n\n" +
                error.message
            );


            showStatus(
                "Error: " +
                error.message,
                true
            );

        }

    }
);



// ==================================================
// SHOW PRODUCTS
// ==================================================

async function showAdminProducts() {

    const container =
        document.getElementById(
            "adminProducts"
        );


    if (!container) {
        return;
    }


    container.innerHTML = `
        <p>Loading products...</p>
    `;


    try {

        const snapshot =
            await window.firebaseGetDocs(

                window.firebaseCollection(
                    window.firebaseDB,
                    "products"
                )

            );


        container.innerHTML = "";


        if (
            snapshot.empty
        ) {

            container.innerHTML = `
                <p>
                    No products added yet.
                </p>
            `;

            return;
        }


        snapshot.forEach(
            function(docSnapshot) {

                const product =
                    docSnapshot.data();


                const id =
                    docSnapshot.id;


                const image =
                    product.image ||
                    (
                        product.images &&
                        product.images[0]
                    ) ||
                    "images/image1.jpg";


                const photoCount =
                    product.images &&
                    Array.isArray(
                        product.images
                    )
                    ?
                    product.images.length
                    :
                    1;


                container.innerHTML += `

                    <div class="admin-product">

                        <img
                            class="admin-product-main-image"
                            src="${image}"
                            alt="${escapeHTML(
                                product.name || ""
                            )}"
                        >


                        <div class="admin-product-info">

                            <strong>
                                ${escapeHTML(
                                    product.name ||
                                    "Product"
                                )}
                            </strong>

                            <br>

                            ₹${Number(
                                product.price || 0
                            ).toLocaleString(
                                "en-IN"
                            )}

                            <br>

                            <small>

                                ${(product.category || "")
                                    .toUpperCase()}

                                •
                                ${photoCount}
                                photo(s)

                                •
                                Stock:
                                ${product.stock || 0}

                            </small>

                        </div>


                        <div class="admin-buttons">

                            <button
                                class="edit-btn"
                                onclick="editProduct('${id}')"
                            >
                                ✏️ Edit
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteProduct('${id}')"
                            >
                                🗑️ Delete
                            </button>

                        </div>

                    </div>

                `;

            }
        );

    }

    catch(error) {

        console.error(
            error
        );


        container.innerHTML = `
            <p>
                ❌ Products load nahi ho rahe.
            </p>
        `;

    }

}



// ==================================================
// EDIT PRODUCT
// ==================================================

async function editProduct(id) {

    try {

        const snapshot =
            await window.firebaseGetDocs(

                window.firebaseCollection(
                    window.firebaseDB,
                    "products"
                )

            );


        let product = null;


        snapshot.forEach(
            function(docSnapshot) {

                if (
                    docSnapshot.id === id
                ) {

                    product = {

                        id:
                            docSnapshot.id,

                        ...docSnapshot.data()

                    };

                }

            }
        );


        if (!product) {

            alert(
                "Product nahi mila."
            );

            return;
        }


        if (!product.images) {

            product.images = [
                product.image
            ];

        }


        document
        .getElementById(
            "editIndex"
        )
        .value =
            id;


        document
        .getElementById(
            "editName"
        )
        .value =
            product.name || "";


        document
        .getElementById(
            "editPrice"
        )
        .value =
            product.price || 0;


        document
        .getElementById(
            "editCategory"
        )
        .value =
            product.category || "sofa";


        document
        .getElementById(
            "editDescription"
        )
        .value =
            product.description || "";


        document
        .getElementById(
            "editStock"
        )
        .value =
            product.stock || 0;


        renderEditPhotos(
            product.images
        );


        const editBox =
            document.getElementById(
                "editBox"
            );


        editBox.style.display =
            "block";


        editBox.scrollIntoView({
            behavior: "smooth"
        });

    }

    catch(error) {

        console.error(
            error
        );

        alert(
            "Edit load nahi hua."
        );

    }

}



// ==================================================
// RENDER EDIT PHOTOS
// ==================================================

function renderEditPhotos(images) {

    const container =
        document.getElementById(
            "editPhotoContainer"
        );


    container.innerHTML = "";


    images.forEach(
        function(image, index) {

            container.innerHTML += `

                <div class="edit-photo">

                    <strong>
                        Photo ${index + 1}
                    </strong>

                    <img
                        src="${image}"
                    >

                    <button
                        type="button"
                        class="change-photo-btn"
                        onclick="changePhoto(${index})"
                    >
                        🖼️ Change Photo
                    </button>

                    <button
                        type="button"
                        class="remove-photo-btn"
                        onclick="removePhoto(${index})"
                    >
                        🗑️ Remove Photo
                    </button>

                </div>

            `;

        }
    );

}



// ==================================================
// GET EDIT PRODUCT
// ==================================================

async function getEditProduct() {

    const id =
        document.getElementById(
            "editIndex"
        ).value;


    const snapshot =
        await window.firebaseGetDocs(

            window.firebaseCollection(
                window.firebaseDB,
                "products"
            )

        );


    let product = null;


    snapshot.forEach(
        function(docSnapshot) {

            if (
                docSnapshot.id === id
            ) {

                product = {

                    id:
                        docSnapshot.id,

                    ...docSnapshot.data()

                };

            }

        }
    );


    return product;

}



// ==================================================
// CHANGE PHOTO
// ==================================================

function changePhoto(photoIndex) {

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";


    input.accept =
        "image/*";


    input.onchange =
        async function() {

            const file =
                input.files[0];


            if (!file) {
                return;
            }


            try {

                const image =
                    await fileToBase64(
                        file
                    );


                const product =
                    await getEditProduct();


                if (!product) {
                    return;
                }


                if (!product.images) {

                    product.images = [
                        product.image
                    ];

                }


                product.images[
                    photoIndex
                ] =
                    image;


                product.image =
                    product.images[0];


                await window.firebaseUpdateDoc(

                    window.firebaseDoc(
                        window.firebaseDB,
                        "products",
                        product.id
                    ),

                    {
                        images:
                            product.images,

                        image:
                            product.image
                    }

                );


                renderEditPhotos(
                    product.images
                );


                showAdminProducts();


                alert(
                    "✅ Photo changed!"
                );

            }

            catch(error) {

                console.error(
                    error
                );

                alert(
                    "Photo change nahi hui."
                );

            }

        };


    input.click();

}



// ==================================================
// REMOVE PHOTO
// ==================================================

async function removePhoto(photoIndex) {

    const product =
        await getEditProduct();


    if (!product) {
        return;
    }


    if (!product.images) {

        product.images = [
            product.image
        ];

    }


    if (
        product.images.length <= 1
    ) {

        alert(
            "Kam se kam 1 photo honi chahiye."
        );

        return;
    }


    const confirmRemove =
        confirm(
            "Photo remove karni hai?"
        );


    if (!confirmRemove) {
        return;
    }


    product.images.splice(
        photoIndex,
        1
    );


    product.image =
        product.images[0];


    await window.firebaseUpdateDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "products",
            product.id
        ),

        {

            images:
                product.images,

            image:
                product.image

        }

    );


    renderEditPhotos(
        product.images
    );


    showAdminProducts();

}



// ==================================================
// ADD NEW PHOTO
// ==================================================

function addNewEditPhoto() {

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";


    input.accept =
        "image/*";


    input.onchange =
        async function() {

            const file =
                input.files[0];


            if (!file) {
                return;
            }


            try {

                const product =
                    await getEditProduct();


                if (!product) {
                    return;
                }


                if (!product.images) {

                    product.images = [
                        product.image
                    ];

                }


                if (
                    product.images.length >= 10
                ) {

                    alert(
                        "Maximum 10 photos allowed."
                    );

                    return;
                }


                const image =
                    await fileToBase64(
                        file
                    );


                product.images.push(
                    image
                );


                await window.firebaseUpdateDoc(

                    window.firebaseDoc(
                        window.firebaseDB,
                        "products",
                        product.id
                    ),

                    {
                        images:
                            product.images
                    }

                );


                renderEditPhotos(
                    product.images
                );


                showAdminProducts();


                alert(
                    "✅ New photo added!"
                );

            }

            catch(error) {

                console.error(
                    error
                );

                alert(
                    "Photo add nahi hui."
                );

            }

        };


    input.click();

}



// ==================================================
// SAVE EDITED PRODUCT
// ==================================================

async function saveEditedProduct() {

    const id =
        document.getElementById(
            "editIndex"
        ).value;


    if (!id) {
        return;
    }


    try {

        const product =
            await getEditProduct();


        if (!product) {

            alert(
                "Product nahi mila."
            );

            return;
        }


        const updatedProduct = {

            name:
                document
                .getElementById(
                    "editName"
                )
                .value
                .trim(),


            price:
                Number(
                    document
                    .getElementById(
                        "editPrice"
                    )
                    .value
                ),


            category:
                document
                .getElementById(
                    "editCategory"
                )
                .value,


            description:
                document
                .getElementById(
                    "editDescription"
                )
                .value
                .trim(),


            stock:
                Number(
                    document
                    .getElementById(
                        "editStock"
                    )
                    .value
                )

        };


        await window.firebaseUpdateDoc(

            window.firebaseDoc(
                window.firebaseDB,
                "products",
                id
            ),

            updatedProduct

        );


        alert(
            "✅ Product updated successfully!"
        );


        cancelEdit();


        showAdminProducts();

    }

    catch(error) {

        console.error(
            error
        );


        alert(
            "❌ Product update nahi hua."
        );

    }

}



// ==================================================
// DELETE PRODUCT
// ==================================================

async function deleteProduct(id) {

    const confirmDelete =
        confirm(
            "Kya aap is product ko delete karna chahte hain?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        await window.firebaseDeleteDoc(

            window.firebaseDoc(
                window.firebaseDB,
                "products",
                id
            )

        );


        alert(
            "✅ Product deleted!"
        );


        showAdminProducts();

    }

    catch(error) {

        console.error(
            error
        );


        alert(
            "❌ Product delete nahi hua."
        );

    }

}



// ==================================================
// CANCEL EDIT
// ==================================================

function cancelEdit() {

    document
    .getElementById(
        "editBox"
    )
    .style.display =
        "none";

}



// ==================================================
// STATUS
// ==================================================

function showStatus(
    message,
    error
) {

    const box =
        document.getElementById(
            "statusMessage"
        );


    if (!box) {
        return;
    }


    box.innerText =
        message;


    box.style.display =
        "block";

}



// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
