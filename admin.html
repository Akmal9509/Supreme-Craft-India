<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel | Supreme Craft India</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ================================
           ADMIN
        ================================= */

        .admin-panel {
            padding: 60px 20px;
        }

        .admin-box {
            max-width: 1100px;
            margin: auto;
        }

        .admin-box form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .admin-box label {
            font-weight: 600;
            margin-top: 8px;
        }

        .admin-box input,
        .admin-box select,
        .admin-box textarea {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-family: inherit;
        }

        .admin-box textarea {
            resize: vertical;
        }

        .admin-box button {
            cursor: pointer;
        }

        .main-admin-btn {
            background: #111;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 7px;
            margin-top: 10px;
            font-size: 15px;
        }

        .main-admin-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* ================================
           IMAGE PREVIEW
        ================================= */

        #imagePreviews {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }

        .preview-item {
            position: relative;
            width: 120px;
        }

        .preview-item img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: block;
        }

        .preview-number {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #111;
            color: white;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* ================================
           STATUS
        ================================= */

        #adminStatus {
            margin: 15px 0;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        #adminStatus.success {
            display: block;
            background: #e8f7e8;
            color: #176b17;
        }

        #adminStatus.error {
            display: block;
            background: #ffeaea;
            color: #a00000;
        }

        #adminStatus.loading {
            display: block;
            background: #f2f2f2;
            color: #333;
        }

        /* ================================
           PRODUCT LIST
        ================================= */

        .admin-product {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
        }

        .admin-product-main-image {
            width: 120px;
            height: 95px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .admin-product-info {
            flex: 1;
        }

        .admin-product-info strong {
            font-size: 18px;
        }

        .admin-product-info small {
            color: #777;
        }

        .admin-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            color: white;
        }

        .edit-btn {
            background: #222;
        }

        .delete-btn {
            background: #c40000;
        }

        /* ================================
           EDIT BOX
        ================================= */

        #editBox {
            display: none;
            margin-top: 40px;
            padding: 25px;
            border: 2px solid #222;
            border-radius: 12px;
            background: #fafafa;
        }

        #editPhotoContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .edit-photo {
            width: 160px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        .edit-photo img {
            width: 140px;
            height: 105px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
            margin-bottom: 8px;
        }

        .edit-photo button {
            width: 100%;
            border: none;
            padding: 9px;
            margin-top: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        .change-photo-btn {
            background: #222;
            color: white;
        }

        .remove-photo-btn {
            background: #c40000;
            color: white;
        }

        .add-photo-btn {
            background: #168000;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .save-edit-btn {
            background: #111;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            margin-top: 25px;
        }

        .cancel-edit-btn {
            background: #777;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            margin-top: 25px;
            margin-left: 8px;
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 700px) {

            .admin-panel {
                padding: 35px 15px;
            }

            .admin-product {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-product-main-image {
                width: 100%;
                height: 220px;
            }

            .admin-buttons {
                width: 100%;
            }

            .admin-buttons button {
                flex: 1;
            }

            .edit-photo {
                width: 100%;
            }

            .edit-photo img {
                width: 100%;
                height: 200px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="site-header">

    <div class="logo">
        SUPREME CRAFT <span>INDIA</span>
    </div>

    <nav>
        <a href="index.html">
            View Website
        </a>
    </nav>

</header>


<!-- ================= ADMIN ================= -->

<section class="admin-panel">

    <div class="admin-box">

        <p class="small-title">
            SUPREME CRAFT INDIA
        </p>

        <h1>
            Admin Panel
        </h1>

        <p>
            Add and manage your furniture products.
        </p>


        <!-- STATUS -->

        <div id="adminStatus"></div>


        <!-- ================= ADD PRODUCT ================= -->

        <h2>
            Add New Product

        <form id="productForm">

            <label for="productName">

        <!-- ================= EDIT BOX ================= -->

        <div id="editBox">

            <h2>
                ✏️ Edit Product
            </h2>


            <input
                type="hidden"
                id="editId"
            >


            <label>
                Product Name
            </label>

            <input
                type="text"
                id="editName"
            >


            <label>
                Price
            </label>

            <input
                type="number"
                id="editPrice"
                min="0"
            >


            <label>
                Category
            </label>

            <select id="editCategory">

                <option value="sofa">
                    Sofa
                </option>

                <option value="chair">
                    Chair
                </option>

                <option value="table">
                    Table
                </option>

                <option value="bed">
                    Bed
                </option>

            </select>


            <label>
                Description
            </label>

            <textarea
                id="editDescription"
                rows="5"
            ></textarea>


            <label>
                Stock
            </label>

            <input
                type="number"
                id="editStock"

            <h3 style="margin-top:30px;">
                🖼️ Product Photos
            </h3>

                onclick="saveEditedProduct()"
            >
                💾 Save Changes
            </button>

                type="button"
                class="cancel-edit-btn"
                onclick="cancelEdit()"

                ✖ Cancel

        </div>


        <!-- ================= PRODUCTS ================= -->

        <h2 style="margin-top:45px;">

        </h2>

        <div id="adminProducts">

                Loading products...
            </p>

        </div>

<!-- ================= SCRIPT ================= -->

<script type="module">

import {
    db
} from "./firebase.js";

import {
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ========================================
// FIRESTORE COLLECTION
// ========================================

const productsCollection =
    collection(db, "products");


// ========================================
// DOM
// ========================================

const productForm =
    document.getElementById("productForm");

const imageInput =
    document.getElementById("productImages");

const imagePreviews =
    document.getElementById("imagePreviews");

const adminProducts =
    document.getElementById("adminProducts");

const statusBox =
    document.getElementById("adminStatus");

const addProductButton =
    document.getElementById("addProductButton");


// ========================================
// STATUS MESSAGE
// ========================================

function showStatus(message, type = "loading") {

    statusBox.textContent =
        message;

    statusBox.className =
        type;

}


function hideStatus() {

    statusBox.textContent =
        "";

    statusBox.className =
        "";

}


// ========================================
// IMAGE FILE -> BASE64
// ========================================

function fileToBase64(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                () => reject(
                    new Error(
                        "Image read failed."
                    )
                );

            reader.readAsDataURL(file);

        }
    );

}


// ========================================
// IMAGE PREVIEW
// ========================================

imageInput.addEventListener(
    "change",
    async function() {

        imagePreviews.innerHTML = "";

        const files =
            Array.from(this.files || []);


        if (files.length > 10) {

            alert(
                "Maximum 10 photos allowed."
            );

            this.value = "";

            return;
        }


        files.forEach(
            (file, index) => {

                const reader =
                    new FileReader();

                reader.onload =
                    event => {

                        const div =
                            document.createElement(
                                "div"
                            );

                        div.className =
                            "preview-item";

                        div.innerHTML = `
                            <span class="preview-number">
                                ${index + 1}
                            </span>

                            <img
                                src="${event.target.result}"
                                alt="Preview ${index + 1}"
                            >
                        `;

                        imagePreviews.appendChild(
                            div
                        );

                    };

                reader.readAsDataURL(file);

            }
        );

    }
);


// ========================================
// ADD PRODUCT
// ========================================

productForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const files =
            Array.from(
                imageInput.files || []
            );


        if (
            files.length < 1 ||
            files.length > 10
        ) {

            alert(
                "Please select 1 to 10 photos."
            );

            return;
        }


        try {

            addProductButton.disabled =
                true;

            showStatus(
                "Adding product to Firestore...",
                "loading"
            );


            const images = [];

            for (const file of files) {

                const image =
                    await fileToBase64(file);

                images.push(image);

            }


            const productData = {

                name:
                    document
                    .getElementById(
                        "productName"
                    )
                    .value
                    .trim(),

                price:
                    Number(
                        document
                        .getElementById(
                            "productPrice"
                        )
                        .value
                    ),

                category:
                    document
                    .getElementById(
                        "productCategory"
                    )
                    .value,

                images:
                    images,

                image:
                    images[0],

                description:
                    document
                    .getElementById(
                        "productDescription"
                    )
                    .value
                    .trim(),

                stock:
                    Number(
                        document
                        .getElementById(
                            "productStock"
                        )
                        .value
                    ),

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            };


            await addDoc(
                productsCollection,
                productData
            );


            productForm.reset();

            imagePreviews.innerHTML =
                "";

            showStatus(
                "✅ Product added successfully!",
                "success"
            );


            await loadProducts();


        } catch (error) {

            console.error(
                "Add Product Error:",
                error
            );

            showStatus(
                "❌ Product add nahi hua. Console me error check karo.",
                "error"
            );

        } finally {

            addProductButton.disabled =
                false;

        }

    }
);


// ========================================
// LOAD PRODUCTS
// ========================================

async function loadProducts() {

    adminProducts.innerHTML = `
        <p>Loading products...</p>
    `;


    try {

        const snapshot =
            await getDocs(
                productsCollection
            );


        if (snapshot.empty) {

            adminProducts.innerHTML = `
                <p>
                    No products added yet.
                </p>
            `;

            return;
        }


        adminProducts.innerHTML =
            "";


        snapshot.forEach(
            docSnapshot => {

                const product =
                    docSnapshot.data();

                const id =
                    docSnapshot.id;


                const images =
                    Array.isArray(
                        product.images
                    )
                    ? product.images
                    : product.image
                        ? [product.image]
                        : [];


                const mainImage =
                    images[0] || "";


                const name =
                    escapeHTML(
                        product.name ||
                        "Premium Furniture"
                    );


                const category =
                    escapeHTML(
                        product.category ||
                        "sofa"
                    );


                const price =
                    Number(
                        product.price || 0
                    );


                const stock =
                    Number(
                        product.stock || 0
                    );


                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "admin-product";


                item.innerHTML = `

                    <img
                        class="admin-product-main-image"
                        src="${mainImage}"
                        alt="${name}"
                    >

                    <div class="admin-product-info">

                        <strong>
                            ${name}
                        </strong>

                        <br>

                        ₹${price.toLocaleString("en-IN")}

                        <br>

                        <small>
                            ${category.toUpperCase()}
                            •
                            ${images.length} photo(s)
                            •
                            Stock: ${stock}
                        </small>

                    </div>

                    <div class="admin-buttons">

                        <button
                            class="edit-btn"
                            data-id="${id}"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            class="delete-btn"
                            data-id="${id}"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                `;


                const editButton =
                    item.querySelector(
                        ".edit-btn"
                    );


                const deleteButton =
                    item.querySelector(
                        ".delete-btn"
                    );


                editButton.addEventListener(
                    "click",
                    () => {

                        editProduct(
                            id,
                            product
                        );

                    }
                );


                deleteButton.addEventListener(
                    "click",
                    () => {

                        deleteProduct(
                            id
                        );

                    }
                );


                adminProducts.appendChild(
                    item
                );

            }
        );


    } catch (error) {

        console.error(
            "Load Products Error:",
            error
        );

        adminProducts.innerHTML = `
            <p style="color:#b00000;">
                ❌ Products load nahi ho rahe.
            </p>
        `;

    }

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ========================================
// EDIT PRODUCT
// ========================================

function editProduct(id, product) {

    let images =
        Array.isArray(product.images)
        ? [...product.images]
        : product.image
            ? [product.image]
            : [];


    document
    .getElementById("editId")
    .value =
        id;


    document
    .getElementById("editName")
    .value =
        product.name || "";


    document
    .getElementById("editPrice")
    .value =
        Number(product.price || 0);


    document
    .getElementById("editCategory")
    .value =
        product.category || "sofa";


    document
    .getElementById("editDescription")
    .value =
        product.description || "";


    document
    .getElementById("editStock")
    .value =
        Number(product.stock || 0);


    window.editImages =
        images;


    renderEditPhotos();


    const editBox =
        document.getElementById(
            "editBox"
        );


    editBox.style.display =
        "block";


    editBox.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


// ========================================
// RENDER EDIT PHOTOS
// ========================================

function renderEditPhotos() {

    const container =
        document.getElementById(
            "editPhotoContainer"
        );


    container.innerHTML =
        "";


    const images =
        window.editImages || [];


    images.forEach(
        (image, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "edit-photo";


            div.innerHTML = `

                <strong>
                    Photo ${index + 1}
                </strong>

                <img
                    src="${image}"
                    alt="Product Photo ${index + 1}"
                >

                <button
                    type="button"
                    class="change-photo-btn"
                    data-index="${index}"
                >
                    🖼️ Change Photo
                </button>

                <button
                    type="button"
                    class="remove-photo-btn"
                    data-index="${index}"
                >
                    🗑️ Remove Photo
                </button>

            `;


            div
            .querySelector(
                ".change-photo-btn"
            )
            .addEventListener(
                "click",
                () => {

                    changePhoto(index);

                }
            );


            div
            .querySelector(
                ".remove-photo-btn"
            )
            .addEventListener(
                "click",
                () => {

                    removePhoto(index);

                }
            );


            container.appendChild(
                div
            );

        }
    );

}


// ========================================
// CHANGE PHOTO
// ========================================

function changePhoto(index) {

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";

    input.accept =
        "image/*";


    input.onchange =
        async function() {

            const file =
                input.files &&
                input.files[0];


            if (!file) {
                return;
            }


            try {

                const image =
                    await fileToBase64(
                        file
                    );


                window.editImages[index] =
                    image;


                renderEditPhotos();


            } catch (error) {

                console.error(error);

                alert(
                    "Photo change nahi ho payi."
                );

            }

        };


    input.click();

}


// ========================================
// REMOVE PHOTO
// ========================================

function removePhoto(index) {

    const images =
        window.editImages || [];


    if (images.length <= 1) {

        alert(
            "Kam se kam 1 photo zaroor honi chahiye."
        );

        return;
    }


    const confirmed =
        confirm(
            `Photo ${index + 1} remove karni hai?`
        );


    if (!confirmed) {
        return;
    }


    images.splice(
        index,
        1
    );


    window.editImages =
        images;


    renderEditPhotos();

}


// ========================================
// ADD NEW EDIT PHOTO
// ========================================

function addNewEditPhoto() {

    const images =
        window.editImages || [];


    if (images.length >= 10) {

        alert(
            "Maximum 10 photos allowed."
        );

        return;
    }


    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";

    input.accept =
        "image/*";


    input.onchange =
        async function() {

            const file =
                input.files &&
                input.files[0];


            if (!file) {
                return;
            }


            try {

                const image =
                    await fileToBase64(
                        file
                    );


                images.push(
                    image
                );


                window.editImages =
                    images;


                renderEditPhotos();


            } catch (error) {

                console.error(error);

                alert(
                    "Photo add nahi ho payi."
                );

            }

        };


    input.click();

}


// ========================================
// SAVE EDITED PRODUCT
// ========================================

window.saveEditedProduct =
async function() {

    const id =
        document
        .getElementById(
            "editId"
        )
        .value;


    if (!id) {

        alert(
            "Product ID missing."
        );

        return;
    }


    const images =
        window.editImages || [];


    if (images.length === 0) {

        alert(
            "Kam se kam 1 photo honi chahiye."
        );

        return;
    }


    const saveButton =
        document.getElementById(
            "saveEditButton"
        );


    try {

        saveButton.disabled =
            true;


        showStatus(
            "Saving changes...",
            "loading"
        );


        const productRef =
            doc(
                db,
                "products",
                id
            );


        const updatedProduct = {

            name:
                document
                .getElementById(
                    "editName"
                )
                .value
                .trim(),

            price:
                Number(
                    document
                    .getElementById(
                        "editPrice"
                    )
                    .value
                ),

            category:
                document
                .getElementById(
                    "editCategory"
                )
                .value,

            description:
                document
                .getElementById(
                    "editDescription"
                )
                .value
                .trim(),

            stock:
                Number(
                    document
                    .getElementById(
                        "editStock"
                    )
                    .value
                ),

            images:
                images,

            image:
                images[0],

            updatedAt:
                serverTimestamp()

        };


        await updateDoc(
            productRef,
            updatedProduct
        );


        showStatus(
            "✅ Product updated successfully!",
            "success"
        );


        cancelEdit();


        await loadProducts();


    } catch (error) {

        console.error(
            "Update Product Error:",
            error
        );

        showStatus(
            "❌ Product update nahi hua.",
            "error"
        );

    } finally {

        saveButton.disabled =
            false;

    }

};


// ========================================
// DELETE PRODUCT
// ========================================

async function deleteProduct(id) {

    const confirmed =
        confirm(
            "Kya aap is product ko delete karna chahte hain?"
        );


    if (!confirmed) {
        return;
    }


    try {

        showStatus(
            "Deleting product...",
            "loading"
        );


        await deleteDoc(
            doc(
                db,
                "products",
                id
            )
        );


        showStatus(
            "✅ Product deleted successfully!",
            "success"
        );


        await loadProducts();


    } catch (error) {

        console.error(
            "Delete Product Error:",
            error
        );

        showStatus(
            "❌ Product delete nahi hua.",
            "error"
        );

    }

}


// ========================================
// CANCEL EDIT
// ========================================

window.cancelEdit =
function() {

    document
    .getElementById(
        "editBox"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "editId"
    )
    .value =
        "";


    window.editImages =
        [];

};


// ========================================
// START
// ========================================

loadProducts();

</script>
