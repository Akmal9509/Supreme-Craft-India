<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | Supreme Craft India</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* ================================
           ADMIN PANEL
        ================================= */

        .admin-panel {
            padding: 60px 20px;
            min-height: 80vh;
        }

        .admin-box {
            max-width: 1100px;
            margin: auto;
        }

        .admin-box form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .admin-box label {
            font-weight: 600;
            margin-top: 10px;
        }

        .admin-box input,
        .admin-box select,
        .admin-box textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        .admin-box input:focus,
        .admin-box select:focus,
        .admin-box textarea:focus {
            border-color: #111;
        }

        .admin-box textarea {
            resize: vertical;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .main-admin-btn {
            background: #111;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 7px;
            margin-top: 12px;
            font-size: 15px;
        }

        .main-admin-btn:hover:not(:disabled) {
            background: #333;
        }

        /* ================================
           STATUS
        ================================= */

        #adminStatus {
            display: none;
            margin: 20px 0;
            padding: 13px;
            border-radius: 7px;
        }

        #adminStatus.success {
            display: block;
            background: #e8f7e8;
            color: #176b17;
        }

        #adminStatus.error {
            display: block;
            background: #ffeaea;
            color: #a00000;
        }

        #adminStatus.loading {
            display: block;
            background: #f2f2f2;
            color: #333;
        }

        /* ================================
           IMAGE PREVIEW
        ================================= */

        #imagePreviews {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }

        .preview-item {
            position: relative;
            width: 120px;
        }

        .preview-item img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #f5f5f5;
        }

        .preview-number {
            position: absolute;
            top: 5px;
            left: 5px;
            z-index: 2;
            background: #111;
            color: #fff;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* ================================
           PRODUCT LIST
        ================================= */

        #adminProducts {
            margin-top: 20px;
        }

        .admin-product {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
        }

        .admin-product-main-image {
            width: 120px;
            height: 95px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f5f5;
            flex-shrink: 0;
        }

        .admin-product-info {
            flex: 1;
            min-width: 0;
        }

        .admin-product-info strong {
            font-size: 18px;
            word-break: break-word;
        }

        .admin-product-info small {
            color: #777;
            line-height: 1.6;
        }

        .admin-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }

        .edit-btn {
            background: #222;
        }

        .edit-btn:hover {
            background: #444;
        }

        .delete-btn {
            background: #c40000;
        }

        .delete-btn:hover {
            background: #a00000;
        }

        /* ================================
           EDIT BOX
        ================================= */

        #editBox {
            display: none;
            margin-top: 40px;
            padding: 25px;
            border: 2px solid #222;
            border-radius: 12px;
            background: #fafafa;
        }

        #editPhotoContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .edit-photo {
            width: 160px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            box-sizing: border-box;
        }

        .edit-photo img {
            width: 140px;
            height: 105px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
            margin: 8px 0;
            background: #f5f5f5;
        }

        .edit-photo button {
            width: 100%;
            border: none;
            padding: 9px;
            margin-top: 5px;
            border-radius: 5px;
        }

        .change-photo-btn {
            background: #222;
            color: white;
        }

        .remove-photo-btn {
            background: #c40000;
            color: white;
        }

        .add-photo-btn {
            background: #168000;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .save-edit-btn {
            background: #111;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            margin-top: 25px;
        }

        .cancel-edit-btn {
            background: #777;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            margin-top: 25px;
            margin-left: 8px;
        }

        /* ================================
           EMPTY / ERROR
        ================================= */

        .admin-empty {
            padding: 25px;
            border: 1px dashed #ccc;
            border-radius: 10px;
            text-align: center;
            color: #777;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .admin-panel {
                padding: 35px 15px;
            }

            .admin-product {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-product-main-image {
                width: 100%;
                height: 220px;
            }

            .admin-buttons {
                width: 100%;
            }

            .admin-buttons button {
                flex: 1;
            }

            .edit-photo {
                width: 100%;
            }

            .edit-photo img {
                width: 100%;
                height: 200px;
            }

            .cancel-edit-btn {
                margin-left: 0;
            }

            #imagePreviews {
                gap: 8px;
            }

            .preview-item,
            .preview-item img {
                width: 95px;
            }

            .preview-item img {
                height: 75px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="logo">
            SUPREME CRAFT <span>INDIA</span>
        </div>

        <nav>
            <a href="index.html">
                View Website
            </a>
        </nav>

    </header>


    <!-- ================= ADMIN ================= -->

    <section class="admin-panel">

        <div class="admin-box">

            <p class="small-title">
                SUPREME CRAFT INDIA
            </p>

            <h1>
                Admin Panel
            </h1>

            <p>
                Add and manage your furniture products.
            </p>


            <!-- STATUS -->

            <div id="adminStatus"></div>


            <!-- ================= ADD PRODUCT ================= -->

            <h2>
                Add New Product
            </h2>

            <form id="productForm">

                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Example: Royal Wooden Sofa"
                    maxlength="150"
                    required
                >


                <label for="productPrice">
                    Price
                </label>

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Example: 24999"
                    min="0"
                    step="1"
                    required
                >


                <label for="productCategory">
                    Category
                </label>

                <select id="productCategory" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="sofa">
                        Sofa
                    </option>

                    <option value="chair">
                        Chair
                    </option>

                    <option value="table">
                        Table
                    </option>

                    <option value="bed">
                        Bed
                    </option>

                </select>


                <label for="productImages">
                    Product Photos
                </label>

                <input
                    type="file"
                    id="productImages"
                    accept="image/*"
                    multiple
                    required
                >

                <p style="font-size:14px;color:#777;">
                    Maximum 10 photos.
                </p>

                <div id="imagePreviews"></div>


                <label for="productDescription">
                    Description
                </label>

                <textarea
                    id="productDescription"
                    rows="5"
                    maxlength="3000"
                    placeholder="Product description"
                    required
                ></textarea>


                <label for="productStock">
                    Stock
                </label>

                <input
                    type="number"
                    id="productStock"
                    placeholder="Example: 10"
                    min="0"
                    step="1"
                    required
                >


                <button
                    type="submit"
                    id="addProductButton"
                    class="main-admin-btn"
                >
                    ➕ Add Product
                </button>

            </form>


            <hr style="
                margin:45px 0;
                border:none;
                border-top:1px solid #ddd;
            ">


            <!-- ================= EDIT BOX ================= -->

            <div id="editBox">

                <h2>
                    ✏️ Edit Product
                </h2>

                <input
                    type="hidden"
                    id="editId"
                >


                <label for="editName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="editName"
                    maxlength="150"
                >


                <label for="editPrice">
                    Price
                </label>

                <input
                    type="number"
                    id="editPrice"
                    min="0"
                    step="1"
                >


                <label for="editCategory">
                    Category
                </label>

                <select id="editCategory">

                    <option value="sofa">
                        Sofa
                    </option>

                    <option value="chair">
                        Chair
                    </option>

                    <option value="table">
                        Table
                    </option>

                    <option value="bed">
                        Bed
                    </option>

                </select>


                <label for="editDescription">
                    Description
                </label>

                <textarea
                    id="editDescription"
                    rows="5"
                    maxlength="3000"
                ></textarea>


                <label for="editStock">
                    Stock
                </label>

                <input
                    type="number"
                    id="editStock"
                    min="0"
                    step="1"
                >


                <h3 style="margin-top:30px;">
                    🖼️ Product Photos
                </h3>

                <div id="editPhotoContainer"></div>


                <button
                    type="button"
                    class="add-photo-btn"
                    id="addEditPhotoButton"
                >
                    ➕ Add New Photo
                </button>


                <br>


                <button
                    type="button"
                    class="save-edit-btn"
                    id="saveEditButton"
                >
                    💾 Save Changes
                </button>


                <button
                    type="button"
                    class="cancel-edit-btn"
                    id="cancelEditButton"
                >
                    ✖ Cancel
                </button>

            </div>


            <!-- ================= PRODUCTS ================= -->

            <h2 style="margin-top:45px;">
                Products
            </h2>

            <div id="adminProducts">

                <p>
                    Loading products...
                </p>

            </div>

        </div>

    </section>


    <!-- ================= SCRIPT ================= -->

    <script type="module">

        import {
            db,
            collection,
            addDoc,
            getDocs,
            updateDoc,
            deleteDoc,
            doc
        } from "./firebase.js";

        import {
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        /* ========================================
           FIRESTORE
        ======================================== */

        const productsCollection =
            collection(db, "products");


        /* ========================================
           DOM
        ======================================== */

        const productForm =
            document.getElementById("productForm");

        const imageInput =
            document.getElementById("productImages");

        const imagePreviews =
            document.getElementById("imagePreviews");

        const adminProducts =
            document.getElementById("adminProducts");

        const statusBox =
            document.getElementById("adminStatus");

        const addProductButton =
            document.getElementById("addProductButton");

        const editBox =
            document.getElementById("editBox");

        const editPhotoContainer =
            document.getElementById("editPhotoContainer");

        const saveEditButton =
            document.getElementById("saveEditButton");

        const cancelEditButton =
            document.getElementById("cancelEditButton");

        const addEditPhotoButton =
            document.getElementById("addEditPhotoButton");


        /* ========================================
           EDIT STATE
        ======================================== */

        let editImages = [];


        /* ========================================
           STATUS
        ======================================== */

        function showStatus(message, type = "loading") {

            statusBox.textContent = message;

            statusBox.className = type;
        }


        function hideStatus() {

            statusBox.textContent = "";

            statusBox.className = "";
        }


        /* ========================================
           ESCAPE HTML
        ======================================== */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* ========================================
           FILE -> BASE64
        ======================================== */

        function fileToBase64(file) {

            return new Promise((resolve, reject) => {

                if (!file) {
                    reject(
                        new Error("File missing.")
                    );
                    return;
                }

                const reader =
                    new FileReader();

                reader.onload = () => {

                    resolve(
                        reader.result
                    );

                };

                reader.onerror = () => {

                    reject(
                        new Error(
                            "Image read failed."
                        )
                    );

                };

                reader.readAsDataURL(file);

            });
        }


        /* ========================================
           IMAGE VALIDATION
        ======================================== */

        function validateImageFile(file) {

            if (!file.type.startsWith("image/")) {

                throw new Error(
                    `${file.name} is not an image.`
                );
            }

            /*
             * Base64 Firestore storage can become very large.
             * Keep individual images reasonably sized.
             */

            const maxSize =
                2 * 1024 * 1024;

            if (file.size > maxSize) {

                throw new Error(
                    `${file.name} 2MB se chhoti honi chahiye.`
                );
            }
        }


        /* ========================================
           IMAGE PREVIEW
        ======================================== */

        imageInput.addEventListener(
            "change",
            function () {

                imagePreviews.innerHTML = "";

                const files =
                    Array.from(
                        this.files || []
                    );


                if (
                    files.length < 1 ||
                    files.length > 10
                ) {

                    alert(
                        "Please select 1 to 10 photos."
                    );

                    this.value = "";

                    return;
                }


                try {

                    files.forEach(
                        (file, index) => {

                            validateImageFile(file);

                            const reader =
                                new FileReader();

                            reader.onload =
                                event => {

                                    const div =
                                        document.createElement(
                                            "div"
                                        );

                                    div.className =
                                        "preview-item";

                                    const number =
                                        document.createElement(
                                            "span"
                                        );

                                    number.className =
                                        "preview-number";

                                    number.textContent =
                                        index + 1;

                                    const img =
                                        document.createElement(
                                            "img"
                                        );

                                    img.src =
                                        event.target.result;

                                    img.alt =
                                        `Preview ${index + 1}`;

                                    div.appendChild(
                                        number
                                    );

                                    div.appendChild(
                                        img
                                    );

                                    imagePreviews.appendChild(
                                        div
                                    );

                                };

                            reader.readAsDataURL(file);

                        }
                    );

                } catch (error) {

                    alert(error.message);

                    this.value = "";

                    imagePreviews.innerHTML = "";
                }

            }
        );


        /* ========================================
           ADD PRODUCT
        ======================================== */

        productForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document
                    .getElementById("productName")
                    .value
                    .trim();


                const price =
                    Number(
                        document
                        .getElementById("productPrice")
                        .value
                    );


                const category =
                    document
                    .getElementById("productCategory")
                    .value;


                const description =
                    document
                    .getElementById("productDescription")
                    .value
                    .trim();


                const stock =
                    Number(
                        document
                        .getElementById("productStock")
                        .value
                    );


                const files =
                    Array.from(
                        imageInput.files || []
                    );


                /* Validation */

                if (!name) {

                    alert(
                        "Product name enter karo."
                    );

                    return;
                }


                if (
                    !Number.isFinite(price) ||
                    price < 0
                ) {

                    alert(
                        "Valid price enter karo."
                    );

                    return;
                }


                if (!category) {

                    alert(
                        "Category select karo."
                    );

                    return;
                }


                if (!description) {

                    alert(
                        "Description enter karo."
                    );

                    return;
                }


                if (
                    !Number.isInteger(stock) ||
                    stock < 0
                ) {

                    alert(
                        "Valid stock enter karo."
                    );

                    return;
                }


                if (
                    files.length < 1 ||
                    files.length > 10
                ) {

                    alert(
                        "Please select 1 to 10 photos."
                    );

                    return;
                }


                try {

                    addProductButton.disabled =
                        true;


                    showStatus(
                        "Adding product to Firestore...",
                        "loading"
                    );


                    const images = [];


                    for (
                        const file of files
                    ) {

                        validateImageFile(file);

                        const image =
                            await fileToBase64(
                                file
                            );

                        images.push(
                            image
                        );

                    }


                    const productData = {

                        name: name,

                        price: price,

                        category: category,

                        images: images,

                        image: images[0],

                        description: description,

                        stock: stock,

                        createdAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    };


                    await addDoc(
                        productsCollection,
                        productData
                    );


                    productForm.reset();

                    imagePreviews.innerHTML =
                        "";


                    showStatus(
                        "✅ Product added successfully!",
                        "success"
                    );


                    await loadProducts();

                } catch (error) {

                    console.error(
                        "Add Product Error:",
                        error
                    );


                    showStatus(
                        "❌ Product add nahi hua: " +
                        error.message,
                        "error"
                    );

                } finally {

                    addProductButton.disabled =
                        false;

                }

            }
        );


        /* ========================================
           LOAD PRODUCTS
        ======================================== */

        async function loadProducts() {

            adminProducts.innerHTML = `
                <p>Loading products...</p>
            `;


            try {

                const snapshot =
                    await getDocs(
                        productsCollection
                    );


                if (snapshot.empty) {

                    adminProducts.innerHTML = `
                        <div class="admin-empty">
                            No products added yet.
                        </div>
                    `;

                    return;
                }


                adminProducts.innerHTML = "";


                snapshot.forEach(
                    docSnapshot => {

                        const product =
                            docSnapshot.data();

                        const id =
                            docSnapshot.id;


                        let images =
                            Array.isArray(
                                product.images
                            )
                            ? product.images
                            : [];


                        if (
                            images.length === 0 &&
                            product.image
                        ) {

                            images = [
                                product.image
                            ];

                        }


                        const mainImage =
                            images[0] || "";


                        const name =
                            product.name ||
                            "Premium Furniture";


                        const category =
                            product.category ||
                            "sofa";


                        const price =
                            Number(
                                product.price || 0
                            );


                        const stock =
                            Number(
                                product.stock || 0
                            );


                        const item =
                            document.createElement(
                                "div"
                            );

                        item.className =
                            "admin-product";


                        /* Image */

                        const img =
                            document.createElement(
                                "img"
                            );

                        img.className =
                            "admin-product-main-image";

                        img.src =
                            mainImage;

                        img.alt =
                            name;

                        img.onerror =
                            function () {

                                this.style.display =
                                    "none";

                            };


                        /* Info */

                        const info =
                            document.createElement(
                                "div"
                            );

                        info.className =
                            "admin-product-info";


                        const strong =
                            document.createElement(
                                "strong"
                            );

                        strong.textContent =
                            name;


                        const priceText =
                            document.createElement(
                                "div"
                            );

                        priceText.textContent =
                            "₹" +
                            price.toLocaleString(
                                "en-IN"
                            );


                        const small =
                            document.createElement(
                                "small"
                            );

                        small.textContent =
                            category.toUpperCase() +
                            " • " +
                            images.length +
                            " photo(s) • Stock: " +
                            stock;


                        info.appendChild(
                            strong
                        );

                        info.appendChild(
                            document.createElement(
                                "br"
                            )
                        );

                        info.appendChild(
                            priceText
                        );

                        info.appendChild(
                            document.createElement(
                                "br"
                            )
                        );

                        info.appendChild(
                            small
                        );


                        /* Buttons */

                        const buttons =
                            document.createElement(
                                "div"
                            );

                        buttons.className =
                            "admin-buttons";


                        const editButton =
                            document.createElement(
                                "button"
                            );

                        editButton.type =
                            "button";

                        editButton.className =
                            "edit-btn";

                        editButton.textContent =
                            "✏️ Edit";


                        const deleteButton =
                            document.createElement(
                                "button"
                            );

                        deleteButton.type =
                            "button";

                        deleteButton.className =
                            "delete-btn";

                        deleteButton.textContent =
                            "🗑️ Delete";


                        editButton.addEventListener(
                            "click",
                            () => {

                                editProduct(
                                    id,
                                    product
                                );

                            }
                        );


                        deleteButton.addEventListener(
                            "click",
                            () => {

                                deleteProduct(
                                    id
                                );

                            }
                        );


                        buttons.appendChild(
                            editButton
                        );

                        buttons.appendChild(
                            deleteButton
                        );


                        item.appendChild(
                            img
                        );

                        item.appendChild(
                            info
                        );

                        item.appendChild(
                            buttons
                        );


                        adminProducts.appendChild(
                            item
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Load Products Error:",
                    error
                );


                adminProducts.innerHTML = `
                    <div class="admin-empty">
                        ❌ Products load nahi ho rahe.
                    </div>
                `;

            }

        }


        /* ========================================
           EDIT PRODUCT
        ======================================== */

        function editProduct(
            id,
            product
        ) {

            editImages =
                Array.isArray(
                    product.images
                )
                ? [...product.images]
                : product.image
                    ? [product.image]
                    : [];


            document
                .getElementById("editId")
                .value =
                id;


            document
                .getElementById("editName")
                .value =
                product.name || "";


            document
                .getElementById("editPrice")
                .value =
                Number(
                    product.price || 0
                );


            document
                .getElementById("editCategory")
                .value =
                product.category || "sofa";


            document
                .getElementById("editDescription")
                .value =
                product.description || "";


            document
                .getElementById("editStock")
                .value =
                Number(
                    product.stock || 0
                );


            renderEditPhotos();


            editBox.style.display =
                "block";


            editBox.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }


        /* ========================================
           RENDER EDIT PHOTOS
        ======================================== */

        function renderEditPhotos() {

            editPhotoContainer.innerHTML =
                "";


            if (
                editImages.length === 0
            ) {

                editPhotoContainer.innerHTML = `
                    <p>
                        No photos available.
                    </p>
                `;

                return;
            }


            editImages.forEach(
                (image, index) => {

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "edit-photo";


                    const title =
                        document.createElement(
                            "strong"
                        );

                    title.textContent =
                        `Photo ${index + 1}`;


                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        image;

                    img.alt =
                        `Product Photo ${index + 1}`;


                    img.onerror =
                        function () {

                            this.alt =
                                "Image unavailable";

                        };


                    const changeButton =
                        document.createElement(
                            "button"
                        );

                    changeButton.type =
                        "button";

                    changeButton.className =
                        "change-photo-btn";

                    changeButton.textContent =
                        "🖼️ Change Photo";


                    const removeButton =
                        document.createElement(
                            "button"
                        );

                    removeButton.type =
                        "button";

                    removeButton.className =
                        "remove-photo-btn";

                    removeButton.textContent =
                        "🗑️ Remove Photo";


                    changeButton.addEventListener(
                        "click",
                        () => {

                            changePhoto(
                                index
                            );

                        }
                    );


                    removeButton.addEventListener(
                        "click",
                        () => {

                            removePhoto(
                                index
                            );

                        }
                    );


                    div.appendChild(
                        title
                    );

                    div.appendChild(
                        img
                    );

                    div.appendChild(
                        changeButton
                    );

                    div.appendChild(
                        removeButton
                    );


                    editPhotoContainer.appendChild(
                        div
                    );

                }
            );

        }


        /* ========================================
           CHANGE PHOTO
        ======================================== */

        function changePhoto(index) {

            const input =
                document.createElement(
                    "input"
                );


            input.type =
                "file";

            input.accept =
                "image/*";


            input.addEventListener(
                "change",
                async function () {

                    const file =
                        input.files &&
                        input.files[0];


                    if (!file) {
                        return;
                    }


                    try {

                        validateImageFile(
                            file
                        );


                        const image =
                            await fileToBase64(
                                file
                            );


                        editImages[index] =
                            image;


                        renderEditPhotos();


                    } catch (error) {

                        console.error(
                            "Change Photo Error:",
                            error
                        );


                        alert(
                            error.message ||
                            "Photo change nahi ho payi."
                        );

                    }

                }
            );


            input.click();

        }


        /* ========================================
           REMOVE PHOTO
        ======================================== */

        function removePhoto(index) {

            if (
                editImages.length <= 1
            ) {

                alert(
                    "Kam se kam 1 photo zaroor honi chahiye."
                );

                return;
            }


            const confirmed =
                confirm(
                    `Photo ${index + 1} remove karni hai?`
                );


            if (!confirmed) {
                return;
            }


            editImages.splice(
                index,
                1
            );


            renderEditPhotos();

        }


        /* ========================================
           ADD NEW EDIT PHOTO
        ======================================== */

        addEditPhotoButton.addEventListener(
            "click",
            function () {

                if (
                    editImages.length >= 10
                ) {

                    alert(
                        "Maximum 10 photos allowed."
                    );

                    return;
                }


                const input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "file";

                input.accept =
                    "image/*";


                input.addEventListener(
                    "change",
                    async function () {

                        const file =
                            input.files &&
                            input.files[0];


                        if (!file) {
                            return;
                        }


                        try {

                            validateImageFile(
                                file
                            );


                            const image =
                                await fileToBase64(
                                    file
                                );


                            editImages.push(
                                image
                            );


                            renderEditPhotos();


                        } catch (error) {

                            console.error(
                                "Add Photo Error:",
                                error
                            );


                            alert(
                                error.message ||
                                "Photo add nahi ho payi."
                            );

                        }

                    }
                );


                input.click();

            }
        );


        /* ========================================
           SAVE EDITED PRODUCT
        ======================================== */

        saveEditButton.addEventListener(
            "click",
            async function () {

                const id =
                    document
                    .getElementById("editId")
                    .value
                    .trim();


                if (!id) {

                    alert(
                        "Product ID missing."
                    );

                    return;
                }


                if (
                    editImages.length === 0
                ) {

                    alert(
                        "Kam se kam 1 photo honi chahiye."
                    );

                    return;
                }


                const name =
                    document
                    .getElementById("editName")
                    .value
                    .trim();


                const price =
                    Number(
                        document
                        .getElementById("editPrice")
                        .value
                    );


                const category =
                    document
                    .getElementById("editCategory")
                    .value;


                const description =
                    document
                    .getElementById("editDescription")
                    .value
                    .trim();


                const stock =
                    Number(
                        document
                        .getElementById("editStock")
                        .value
                    );


                /* Validation */

                if (!name) {

                    alert(
                        "Product name enter karo."
                    );

                    return;
                }


                if (
                    !Number.isFinite(price) ||
                    price < 0
                ) {

                    alert(
                        "Valid price enter karo."
                    );

                    return;
                }


                if (!category) {

                    alert(
                        "Category select karo."
                    );

                    return;
                }


                if (!description) {

                    alert(
                        "Description enter karo."
                    );

                    return;
                }


                if (
                    !Number.isInteger(stock) ||
                    stock < 0
                ) {

                    alert(
                        "Valid stock enter karo."
                    );

                    return;
                }


                try {

                    saveEditButton.disabled =
                        true;


                    showStatus(
                        "Saving changes...",
                        "loading"
                    );


                    const productRef =
                        doc(
                            db,
                            "products",
                            id
                        );


                    const updatedProduct = {

                        name: name,

                        price: price,

                        category: category,

                        description:
                            description,

                        stock: stock,

                        images:
                            [...editImages],

                        image:
                            editImages[0],

                        updatedAt:
                            serverTimestamp()

                    };


                    await updateDoc(
                        productRef,
                        updatedProduct
                    );


                    showStatus(
                        "✅ Product updated successfully!",
                        "success"
                    );


                    cancelEdit();


                    await loadProducts();


                } catch (error) {

                    console.error(
                        "Update Product Error:",
                        error
                    );


                    showStatus(
                        "❌ Product update nahi hua: " +
                        error.message,
                        "error"
                    );

                } finally {

                    saveEditButton.disabled =
                        false;

                }

            }
        );


        /* ========================================
           DELETE PRODUCT
        ======================================== */

        async function deleteProduct(id) {

            if (!id) {

                alert(
                    "Product ID missing."
                );

                return;
            }


            const confirmed =
                confirm(
                    "Kya aap is product ko delete karna chahte hain?"
                );


            if (!confirmed) {
                return;
            }


            try {

                showStatus(
                    "Deleting product...",
                    "loading"
                );


                await deleteDoc(
                    doc(
                        db,
                        "products",
                        id
                    )
                );


                showStatus(
                    "✅ Product deleted successfully!",
                    "success"
                );


                if (
                    document
                    .getElementById("editId")
                    .value === id
                ) {

                    cancelEdit();

                }


                await loadProducts();


            } catch (error) {

                console.error(
                    "Delete Product Error:",
                    error
                );


                showStatus(
                    "❌ Product delete nahi hua: " +
                    error.message,
                    "error"
                );

            }

        }


        /* ========================================
           CANCEL EDIT
        ======================================== */

        function cancelEdit() {

            editBox.style.display =
                "none";


            document
                .getElementById("editId")
                .value =
                "";


            editImages =
                [];


            editPhotoContainer.innerHTML =
                "";

        }


        cancelEditButton.addEventListener(
            "click",
            cancelEdit
        );


        /* ========================================
           START
        ======================================== */

        loadProducts();

    </script>

</body>

</html>
