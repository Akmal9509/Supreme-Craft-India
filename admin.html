<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel | Supreme Craft India</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================
           LOGIN
        ========================= */

        #loginSection {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 14px;
            box-sizing: border-box;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .login-box h1 {
            margin: 8px 0 25px;
        }

        .login-box label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .login-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #loginStatus {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        #loginStatus.error {
            display: block;
            background: #ffeaea;
            color: #a00000;
        }

        #loginStatus.success {
            display: block;
            background: #e8f7e8;
            color: #176b17;
        }


        /* =========================
           ADMIN PANEL
        ========================= */

        #adminSection {
            display: none;
        }

        .admin-panel {
            padding: 50px 20px;
        }

        .admin-box {
            max-width: 1100px;
            margin: auto;
        }

        .admin-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .logout-button {
            background: #c40000;
            color: white;
            border: none;
            padding: 11px 17px;
            border-radius: 7px;
            cursor: pointer;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .admin-form label {
            font-weight: 600;
            margin-top: 10px;
        }

        .admin-form input,
        .admin-form select,
        .admin-form textarea,
        #editBox input,
        #editBox select,
        #editBox textarea {

            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-family: inherit;
            font-size: 15px;
        }

        .admin-form textarea,
        #editBox textarea {
            resize: vertical;
        }

        .main-admin-btn {
            background: #111;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 7px;
            margin-top: 12px;
            font-size: 15px;
            cursor: pointer;
        }

        .main-admin-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }


        /* =========================
           STATUS
        ========================= */

        #adminStatus {
            margin: 15px 0;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        #adminStatus.success {
            display: block;
            background: #e8f7e8;
            color: #176b17;
        }

        #adminStatus.error {
            display: block;
            background: #ffeaea;
            color: #a00000;
        }

        #adminStatus.loading {
            display: block;
            background: #f2f2f2;
            color: #333;
        }


        /* =========================
           IMAGE PREVIEW
        ========================= */

        #imagePreviews {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }

        .preview-item {
            position: relative;
            width: 120px;
        }

        .preview-item img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: block;
        }

        .preview-number {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #111;
            color: white;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 12px;
        }


        /* =========================
           PRODUCTS
        ========================= */

        .admin-product {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
        }

        .admin-product-main-image {
            width: 120px;
            height: 95px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .admin-product-info {
            flex: 1;
        }

        .admin-product-info strong {
            font-size: 18px;
        }

        .admin-product-info small {
            color: #777;
        }

        .admin-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .edit-btn {
            background: #222;
        }

        .delete-btn {
            background: #c40000;
        }


        /* =========================
           EDIT BOX
        ========================= */

        #editBox {
            display: none;
            margin-top: 40px;
            padding: 25px;
            border: 2px solid #222;
            border-radius: 12px;
            background: #fafafa;
        }

        #editPhotoContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .edit-photo {
            width: 160px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            box-sizing: border-box;
        }

        .edit-photo img {
            width: 140px;
            height: 105px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
            margin-bottom: 8px;
        }

        .edit-photo button {
            width: 100%;
            border: none;
            padding: 9px;
            margin-top: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        .change-photo-btn {
            background: #222;
            color: white;
        }

        .remove-photo-btn {
            background: #c40000;
            color: white;
        }

        .add-photo-btn {
            background: #168000;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
        }

        .save-edit-btn {
            background: #111;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            margin-top: 25px;
            cursor: pointer;
        }

        .cancel-edit-btn {
            background: #777;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 6px;
            margin-top: 25px;
            margin-left: 8px;
            cursor: pointer;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .admin-panel {
                padding: 35px 15px;
            }

            .admin-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-product {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-product-main-image {
                width: 100%;
                height: 220px;
            }

            .admin-buttons {
                width: 100%;
            }

            .admin-buttons button {
                flex: 1;
            }

            .edit-photo {
                width: 100%;
            }

            .edit-photo img {
                width: 100%;
                height: 200px;
            }

            .login-box {
                padding: 25px 20px;
            }
        }

    </style>

</head>

<script type="module">

import {
    db,
    app
} from "./firebase.js";


import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ========================================
// ADMIN UID
// ========================================

const ADMIN_UID =
    "nihoCDoFY2YTpcfpDeQZTUWXZp42";


// ========================================
// FIREBASE AUTH
// ========================================

const auth = getAuth(app);


// ========================================
// FIRESTORE
// ========================================

const productsCollection =
    collection(db, "products");


// ========================================
// DOM
// ========================================

const loginSection =
    document.getElementById("loginSection");

const adminSection =
    document.getElementById("adminSection");

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginStatus =
    document.getElementById("loginStatus");

const logoutButton =
    document.getElementById("logoutButton");

const productForm =
    document.getElementById("productForm");

const imageInput =
    document.getElementById("productImages");

const imagePreviews =
    document.getElementById("imagePreviews");

const adminProducts =
    document.getElementById("adminProducts");

const statusBox =
    document.getElementById("adminStatus");

const addProductButton =
    document.getElementById("addProductButton");


// ========================================
// LOGIN STATUS
// ========================================

function showLoginStatus(message, type) {

    loginStatus.textContent =
        message;

    loginStatus.className =
        type;

}


function clearLoginStatus() {

    loginStatus.textContent =
        "";

    loginStatus.className =
        "";

}


// ========================================
// ADMIN STATUS
// ========================================

function showStatus(message, type = "loading") {

    statusBox.textContent =
        message;

    statusBox.className =
        type;

}


function clearStatus() {

    statusBox.textContent =
        "";

    statusBox.className =
        "";

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// FILE -> BASE64
// ========================================

function fileToBase64(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload = () => {

                resolve(
                    reader.result
                );

            };

            reader.onerror = () => {

                reject(
                    new Error(
                        "Image read failed."
                    )
                );

            };

            reader.readAsDataURL(file);

        }
    );

}


// ========================================
// IMAGE VALIDATION
// ========================================

function validateImageFile(file) {

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif"
    ];

    if (!allowedTypes.includes(file.type)) {

        throw new Error(
            "Only JPG, PNG, WEBP or GIF images are allowed."
        );

    }

    // 5 MB maximum per image
    if (file.size > 5 * 1024 * 1024) {

        throw new Error(
            "Each image must be smaller than 5 MB."
        );

    }

}


// ========================================
// IMAGE PREVIEW
// ========================================

imageInput.addEventListener(
    "change",
    function() {

        imagePreviews.innerHTML = "";

        const files =
            Array.from(
                this.files || []
            );


        if (files.length < 1) {
            return;
        }


        if (files.length > 10) {

            alert(
                "Maximum 10 photos allowed."
            );

            this.value = "";

            return;
        }


        try {

            files.forEach(
                (file, index) => {

                    validateImageFile(file);

                    const reader =
                        new FileReader();

                    reader.onload =
                        event => {

                            const div =
                                document.createElement(
                                    "div"
                                );

                            div.className =
                                "preview-item";


                            const number =
                                document.createElement(
                                    "span"
                                );

                            number.className =
                                "preview-number";

                            number.textContent =
                                index + 1;


                            const img =
                                document.createElement(
                                    "img"
                                );

                            img.src =
                                event.target.result;

                            img.alt =
                                `Preview ${index + 1}`;


                            div.appendChild(
                                number
                            );

                            div.appendChild(
                                img
                            );

                            imagePreviews.appendChild(
                                div
                            );

                        };


                    reader.readAsDataURL(file);

                }
            );

        } catch (error) {

            alert(
                error.message
            );

            this.value = "";

            imagePreviews.innerHTML = "";

        }

    }
);


// ========================================
// LOGIN
// ========================================

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
            document
            .getElementById("loginPassword")
            .value;


        if (!email || !password) {

            showLoginStatus(
                "Email aur password required hai.",
                "error"
            );

            return;
        }


        try {

            loginButton.disabled =
                true;

            showLoginStatus(
                "Login ho raha hai...",
                "success"
            );


            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            // UID check
            if (
                credential.user.uid !==
                ADMIN_UID
            ) {

                await signOut(auth);

                throw new Error(
                    "Ye account Admin account nahi hai."
                );

            }


            showLoginStatus(
                "Login successful!",
                "success"
            );


        } catch (error) {

            console.error(
                "Login Error:",
                error
            );


            let message =
                "Login failed.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "Email ya password galat hai.";

            } else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "Admin user nahi mila.";

            } else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "Password galat hai.";

            } else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "Email format galat hai.";

            } else {

                message =
                    error.message;

            }


            showLoginStatus(
                "❌ " + message,
                "error"
            );

        } finally {

            loginButton.disabled =
                false;

        }

    }
);


// ========================================
// AUTH STATE
// ========================================

onAuthStateChanged(
    auth,
    async function(user) {

        if (!user) {

            loginSection.style.display =
                "flex";

            adminSection.style.display =
                "none";

            return;
        }


        // UID security check
        if (
            user.uid !==
            ADMIN_UID
        ) {

            await signOut(auth);

            loginSection.style.display =
                "flex";

            adminSection.style.display =
                "none";

            showLoginStatus(
                "❌ Unauthorized account.",
                "error"
            );

            return;
        }


        loginSection.style.display =
            "none";

        adminSection.style.display =
            "block";


        clearLoginStatus();


        await loadProducts();

    }
);


// ========================================
// LOGOUT
// ========================================

logoutButton.addEventListener(
    "click",
    async function() {

        try {

            await signOut(auth);

        } catch (error) {

            console.error(
                "Logout Error:",
                error
            );

            alert(
                "Logout failed."
            );

        }

    }
);


// ========================================
// ADD PRODUCT
// ========================================

productForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const user =
            auth.currentUser;


        if (
            !user ||
            user.uid !== ADMIN_UID
        ) {

            alert(
                "Admin login required."
            );

            return;
        }


        const files =
            Array.from(
                imageInput.files || []
            );


        if (
            files.length < 1 ||
            files.length > 10
        ) {

            alert(
                "Please select 1 to 10 photos."
            );

            return;
        }


        try {

            addProductButton.disabled =
                true;


            showStatus(
                "Product add ho raha hai...",
                "loading"
            );


            for (const file of files) {

                validateImageFile(file);

            }


            const name =
                document
                .getElementById("productName")
                .value
                .trim();

            const price =
                Number(
                    document
                    .getElementById("productPrice")
                    .value
                );

            const category =
                document
                .getElementById("productCategory")
                .value;

            const description =
                document
                .getElementById("productDescription")
                .value
                .trim();

            const stock =
                Number(
                    document
                    .getElementById("productStock")
                    .value
                );


            if (!name) {
                throw new Error(
                    "Product name required."
                );
            }

            if (!category) {
                throw new Error(
                    "Category select karo."
                );
            }

            if (
                !Number.isFinite(price) ||
                price < 0
            ) {
                throw new Error(
                    "Price valid nahi hai."
                );
            }

            if (
                !Number.isInteger(stock) ||
                stock < 0
            ) {
                throw new Error(
                    "Stock valid nahi hai."
                );
            }


            const images = [];


            for (
                const file of files
            ) {

                const image =
                    await fileToBase64(
                        file
                    );

                images.push(
                    image
                );

            }


            const productData = {

                name:
                    name,

                price:
                    price,

                category:
                    category,

                images:
                    images,

                image:
                    images[0],

                description:
                    description,

                stock:
                    stock,

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            };


            await addDoc(
                productsCollection,
                productData
            );


            productForm.reset();

            imagePreviews.innerHTML =
                "";


            showStatus(
                "✅ Product successfully added!",
                "success"
            );


            await loadProducts();

        } catch (error) {

            console.error(
                "Add Product Error:",
                error
            );


            showStatus(
                "❌ " +
                error.message,
                "error"
            );

        } finally {

            addProductButton.disabled =
                false;

        }

    }
);


// ========================================
// LOAD PRODUCTS
// ========================================

async function loadProducts() {

    if (
        !auth.currentUser ||
        auth.currentUser.uid !== ADMIN_UID
    ) {

        return;
    }


    adminProducts.innerHTML =
        "<p>Loading products...</p>";


    try {

        const snapshot =
            await getDocs(
                productsCollection
            );


        if (snapshot.empty) {

            adminProducts.innerHTML =
                "<p>No products added yet.</p>";

            return;
        }


        adminProducts.innerHTML =
            "";


        snapshot.forEach(
            productSnapshot => {

                const product =
                    productSnapshot.data();

                const id =
                    productSnapshot.id;


                const images =
                    Array.isArray(
                        product.images
                    )
                    ? product.images
                    : product.image
                        ? [product.image]
                        : [];


                const mainImage =
                    images[0] || "";


                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "admin-product";


                const image =
                    document.createElement(
                        "img"
                    );

                image.className =
                    "admin-product-main-image";

                image.src =
                    mainImage;

                image.alt =
                    product.name ||
                    "Product";


                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "admin-product-info";


                const strong =
                    document.createElement(
                        "strong"
                    );

                strong.textContent =
                    product.name ||
                    "Premium Furniture";


                const price =
                    document.createElement(
                        "div"
                    );

                price.textContent =
                    "₹" +
                    Number(
                        product.price || 0
                    ).toLocaleString(
                        "en-IN"
                    );


                const small =
                    document.createElement(
                        "small"
                    );

                small.textContent =
                    `${String(
                        product.category || "sofa"
                    ).toUpperCase()} • ${
                        images.length
                    } photo(s) • Stock: ${
                        Number(
                            product.stock || 0
                        )
                    }`;


                info.appendChild(
                    strong
                );

                info.appendChild(
                    document.createElement(
                        "br"
                    )
                );

                info.appendChild(
                    price
                );

                info.appendChild(
                    document.createElement(
                        "br"
                    )
                );

                info.appendChild(
                    small
                );


                const buttons =
                    document.createElement(
                        "div"
                    );

                buttons.className =
                    "admin-buttons";


                const editButton =
                    document.createElement(
                        "button"
                    );

                editButton.type =
                    "button";

                editButton.className =
                    "edit-btn";

                editButton.textContent =
                    "✏️ Edit";


                editButton.addEventListener(
                    "click",
                    function() {

                        editProduct(
                            id,
                            product
                        );

                    }
                );


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.type =
                    "button";

                deleteButton.className =
                    "delete-btn";

                deleteButton.textContent =
                    "🗑️ Delete";


                deleteButton.addEventListener(
                    "click",
                    function() {

                        deleteProduct(
                            id
                        );

                    }
                );


                buttons.appendChild(
                    editButton
                );

                buttons.appendChild(
                    deleteButton
                );


                item.appendChild(
                    image
                );

                item.appendChild(
                    info
                );

                item.appendChild(
                    buttons
                );


                adminProducts.appendChild(
                    item
                );

            }
        );

    } catch (error) {

        console.error(
            "Load Products Error:",
            error
        );


        adminProducts.innerHTML = `
            <p style="color:#b00000;">
                ❌ Products load nahi ho rahe.
            </p>
        `;

    }

}


// ========================================
// EDIT PRODUCT
// ========================================

function editProduct(id, product) {

    let images =
        Array.isArray(product.images)
        ? [...product.images]
        : product.image
            ? [product.image]
            : [];


    document.getElementById(
        "editId"
    ).value =
        id;


    document.getElementById(
        "editName"
    ).value =
        product.name || "";


    document.getElementById(
        "editPrice"
    ).value =
        Number(
            product.price || 0
        );


    document.getElementById(
        "editCategory"
    ).value =
        product.category || "sofa";


    document.getElementById(
        "editDescription"
    ).value =
        product.description || "";


    document.getElementById(
        "editStock"
    ).value =
        Number(
            product.stock || 0
        );


    window.editImages =
        images;


    renderEditPhotos();


    const editBox =
        document.getElementById(
            "editBox"
        );


    editBox.style.display =
        "block";


    editBox.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


// ========================================
// RENDER EDIT PHOTOS
// ========================================

function renderEditPhotos() {

    const container =
        document.getElementById(
            "editPhotoContainer"
        );


    container.innerHTML =
        "";


    const images =
        window.editImages || [];


    if (images.length === 0) {

        container.innerHTML =
            "<p>No photos.</p>";

        return;
    }


    images.forEach(
        function(image, index) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "edit-photo";


            const title =
                document.createElement(
                    "strong"
                );

            title.textContent =
                `Photo ${index + 1}`;


            const img =
                document.createElement(
                    "img"
                );

            img.src =
                image;

            img.alt =
                `Product Photo ${index + 1}`;


            const changeButton =
                document.createElement(
                    "button"
                );

            changeButton.type =
                "button";

            changeButton.className =
                "change-photo-btn";

            changeButton.textContent =
                "🖼️ Change Photo";


            changeButton.addEventListener(
                "click",
                function() {

                    changePhoto(
                        index
                    );

                }
            );


            const removeButton =
                document.createElement(
                    "button"
                );

            removeButton.type =
                "button";

            removeButton.className =
                "remove-photo-btn";

            removeButton.textContent =
                "🗑️ Remove Photo";


            removeButton.addEventListener(
                "click",
                function() {

                    removePhoto(
                        index
                    );

                }
            );


            div.appendChild(
                title
            );

            div.appendChild(
                img
            );

            div.appendChild(
                changeButton
            );

            div.appendChild(
                removeButton
            );


            container.appendChild(
                div
            );

        }
    );

}


// ========================================
// CHANGE PHOTO
// ========================================

function changePhoto(index) {

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";

    input.accept =
        "image/jpeg,image/png,image/webp,image/gif";


    input.addEventListener(
        "change",
        async function() {

            const file =
                input.files &&
                input.files[0];


            if (!file) {
                return;
            }


            try {

                validateImageFile(
                    file
                );


                const image =
                    await fileToBase64(
                        file
                    );


                window.editImages[index] =
                    image;


                renderEditPhotos();

            } catch (error) {

                console.error(
                    error
                );

                alert(
                    error.message
                );

            }

        }
    );


    input.click();

}


// ========================================
// REMOVE PHOTO
// ========================================

function removePhoto(index) {

    const images =
        window.editImages || [];


    if (images.length <= 1) {

        alert(
            "Kam se kam 1 photo honi chahiye."
        );

        return;
    }


    if (
        !confirm(
            `Photo ${index + 1} remove karni hai?`
        )
    ) {

        return;
    }


    images.splice(
        index,
        1
    );


    window.editImages =
        images;


    renderEditPhotos();

}


// ========================================
// ADD NEW EDIT PHOTO
// ========================================

document
.getElementById(
    "addEditPhotoButton"
)
.addEventListener(
    "click",
    function() {

        const images =
            window.editImages || [];


        if (images.length >= 10) {

            alert(
                "Maximum 10 photos allowed."
            );

            return;
        }


        const input =
            document.createElement(
                "input"
            );


        input.type =
            "file";

        input.accept =
            "image/jpeg,image/png,image/webp,image/gif";


        input.addEventListener(
            "change",
            async function() {

                const file =
                    input.files &&
                    input.files[0];


                if (!file) {
                    return;
                }


                try {

                    validateImageFile(
                        file
                    );


                    const image =
                        await fileToBase64(
                            file
                        );


                    images.push(
                        image
                    );


                    window.editImages =
                        images;


                    renderEditPhotos();

                } catch (error) {

                    console.error(
                        error
                    );

                    alert(
                        error.message
                    );

                }

            }
        );


        input.click();

    }
);


// ========================================
// SAVE EDITED PRODUCT
// ========================================

document
.getElementById(
    "saveEditButton"
)
.addEventListener(
    "click",
    async function() {

        const user =
            auth.currentUser;


        if (
            !user ||
            user.uid !== ADMIN_UID
        ) {

            alert(
                "Admin login required."
            );

            return;
        }


        const id =
            document
            .getElementById(
                "editId"
            )
            .value;


        if (!id) {

            alert(
                "Product ID missing."
            );

            return;
        }


        const images =
            window.editImages || [];


        if (images.length === 0) {

            alert(
                "Kam se kam 1 photo honi chahiye."
            );

            return;
        }


        const saveButton =
            document.getElementById(
                "saveEditButton"
            );


        try {

            saveButton.disabled =
                true;


            showStatus(
                "Changes save ho rahe hain...",
                "loading"
            );


            const name =
                document
                .getElementById(
                    "editName"
                )
                .value
                .trim();


            const price =
                Number(
                    document
                    .getElementById(
                        "editPrice"
                    )
                    .value
                );


            const category =
                document
                .getElementById(
                    "editCategory"
                )
                .value;


            const description =
                document
                .getElementById(
                    "editDescription"
                )
                .value
                .trim();


            const stock =
                Number(
                    document
                    .getElementById(
                        "editStock"
                    )
                    .value
                );


            if (!name) {
                throw new Error(
                    "Product name required."
                );
            }


            if (!Number.isFinite(price) || price < 0) {

                throw new Error(
                    "Price valid nahi hai."
                );

            }


            if (!Number.isInteger(stock) || stock < 0) {

                throw new Error(
                    "Stock valid nahi hai."
                );

            }


            const productRef =
                doc(
                    db,
                    "products",
                    id
                );


            await updateDoc(
                productRef,
                {

                    name:
                        name,

                    price:
                        price,

                    category:
                        category,

                    description:
                        description,

                    stock:
                        stock,

                    images:
                        images,

                    image:
                        images[0],

                    updatedAt:
                        serverTimestamp()

                }
            );


            showStatus(
                "✅ Product updated successfully!",
                "success"
            );


            cancelEdit();


            await loadProducts();

        } catch (error) {

            console.error(
                "Update Product Error:",
                error
            );


            showStatus(
                "❌ " +
                error.message,
                "error"
            );

        } finally {

            saveButton.disabled =
                false;

        }

    }
);


// ========================================
// DELETE PRODUCT
// ========================================

async function deleteProduct(id) {

    const user =
        auth.currentUser;


    if (
        !user ||
        user.uid !== ADMIN_UID
    ) {

        alert(
            "Admin login required."
        );

        return;
    }


    if (
        !confirm(
            "Kya aap is product ko delete karna chahte hain?"
        )
    ) {

        return;
    }


    try {

        showStatus(
            "Product delete ho raha hai...",
            "loading"
        );


        await deleteDoc(
            doc(
                db,
                "products",
                id
            )
        );


        showStatus(
            "✅ Product deleted successfully!",
            "success"
        );


        await loadProducts();

    } catch (error) {

        console.error(
            "Delete Product Error:",
            error
        );


        showStatus(
            "❌ Product delete nahi hua.",
            "error"
        );

    }

}


// ========================================
// CANCEL EDIT
// ========================================

document
.getElementById(
    "cancelEditButton"
)
.addEventListener(
    "click",
    cancelEdit
);


function cancelEdit() {

    document
    .getElementById(
        "editBox"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "editId"
    )
    .value =
        "";


    window.editImages =
        [];

}

</script>
