<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product | Supreme Craft India</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ================= PRODUCT PAGE ================= */

        .product-detail {
            max-width: 1200px;
            margin: 60px auto;
            padding: 20px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 50px;
        }


        /* ================= IMAGE ================= */

        .product-image-area {
            width: 100%;
        }


        .main-product-image {
            width: 100%;
            height: 520px;

            display: block;

            object-fit: contain;

            background: #f7f7f7;

            border-radius: 16px;
        }


        .product-thumbnails {
            display: flex;

            gap: 10px;

            margin-top: 15px;

            overflow-x: auto;

            padding-bottom: 5px;
        }


        .product-thumbnails img {
            width: 85px;
            height: 70px;

            flex: 0 0 auto;

            object-fit: cover;

            border-radius: 8px;

            cursor: pointer;

            border: 2px solid transparent;
        }


        .product-thumbnails img:hover {
            border-color: #222;
        }


        /* ================= INFORMATION ================= */

        .detail-info {
            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .product-category {
            display: inline-block;

            text-transform: uppercase;

            letter-spacing: 2px;

            font-size: 13px;

            color: #777;

            margin-bottom: 10px;
        }


        .detail-info h1 {
            font-size: 42px;

            line-height: 1.15;

            margin: 0 0 15px;
        }


        .product-price {
            font-size: 30px;

            margin: 0 0 20px;
        }


        .product-description {
            color: #555;

            line-height: 1.8;

            margin-bottom: 15px;
        }


        .stock {
            margin: 10px 0 20px;
        }


        /* ================= QUANTITY ================= */

        .quantity-box {
            display: flex;

            align-items: center;

            gap: 15px;

            margin: 15px 0 25px;
        }


        .quantity-box button {
            width: 42px;
            height: 42px;

            border: 1px solid #ddd;

            background: #fff;

            border-radius: 6px;

            font-size: 22px;

            cursor: pointer;
        }


        .quantity-box button:hover {
            background: #f2f2f2;
        }


        .quantity-box span {
            min-width: 30px;

            text-align: center;

            font-size: 18px;

            font-weight: 600;
        }


        /* ================= BUTTONS ================= */

        .add-button,
        .whatsapp-button {
            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            margin-top: 10px;
        }


        .add-button {
            background: #111;

            color: #fff;
        }


        .add-button:hover {
            background: #333;
        }


        .whatsapp-button {
            background: #168000;

            color: #fff;
        }


        .whatsapp-button:hover {
            background: #106600;
        }


        /* ================= LOADING ================= */

        .product-loading {
            min-height: 500px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 15px;

            font-size: 18px;
        }


        .loader {
            width: 45px;
            height: 45px;

            border: 5px solid #ddd;

            border-top-color: #111;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* ================= ERROR ================= */

        .product-error {
            max-width: 700px;

            margin: 100px auto;

            padding: 40px 20px;

            text-align: center;
        }


        .product-error h1 {
            margin-bottom: 10px;
        }


        .back-button {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 20px;

            background: #111;

            color: #fff;

            text-decoration: none;

            border-radius: 6px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .product-detail {

                grid-template-columns: 1fr;

                gap: 25px;

                margin: 25px auto;

                padding: 15px;

            }


            .main-product-image {

                height: 350px;

            }


            .detail-info h1 {

                font-size: 30px;

            }


            .product-price {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="site-header">

    <div class="logo">

        SUPREME CRAFT
        <span>INDIA</span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="index.html#about">
            About
        </a>

        <a href="index.html#contact">
            Contact
        </a>

    </nav>


    <a
        href="cart.html"
        class="cart-link"
    >

        🛒 Cart

        <span id="cartCount">
            0
        </span>

    </a>

</header>


<!-- ================= LOADING ================= -->

<div
    id="loading"
    class="product-loading"
>

    <div class="loader"></div>

    <div>
        Loading product...
    </div>

</div>


<!-- ================= ERROR ================= -->

<div
    id="productError"
    class="product-error"
    style="display:none;"
>

    <h1>
        Product Not Found
    </h1>

    <p id="errorMessage">
        Unable to load this product.
    </p>

    <a
        href="index.html#products"
        class="back-button"
    >
        ← Back to Products
    </a>

</div>


<!-- ================= PRODUCT ================= -->

<section
    id="productSection"
    class="product-detail"
    style="display:none;"
>


    <!-- IMAGE -->

    <div class="product-image-area">

        <img
            id="productImage"
            class="main-product-image"
            src=""
            alt="Product"
        >


        <div
            id="productThumbnails"
            class="product-thumbnails"
        ></div>

    </div>


    <!-- INFORMATION -->

    <div class="detail-info">


        <span
            id="productCategory"
            class="product-category"
        >
            FURNITURE
        </span>


        <h1 id="productName">
            Product
        </h1>


        <h2 class="product-price">

            ₹<span id="productPrice">
                0
            </span>

        </h2>


        <p
            id="productDescription"
            class="product-description"
        ></p>


        <p class="stock">

            Stock:

            <strong id="productStock">
                0
            </strong>

        </p>


        <!-- QUANTITY -->

        <div class="quantity-box">

            <button
                type="button"
                id="minusBtn"
            >
                −
            </button>


            <span id="quantity">
                1
            </span>


            <button
                type="button"
                id="plusBtn"
            >
                +
            </button>

        </div>


        <!-- ADD CART -->

        <button
            type="button"
            id="addCartBtn"
            class="add-button"
        >
            🛒 Add to Cart
        </button>


        <!-- WHATSAPP -->

        <button
            type="button"
            id="whatsappBtn"
            class="whatsapp-button"
        >
            📱 Buy on WhatsApp
        </button>


    </div>

</section>


<!-- ================= FIRESTORE ================= -->

<script type="module">

    import {
        db,
        doc,
        getDoc
    } from "./firebase.js";


    /* ================= VARIABLES ================= */

    let product = null;

    let quantity = 1;


    /* ================= URL ID ================= */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const productId =
        urlParams.get("id");


    /* ================= ELEMENTS ================= */

    const loading =
        document.getElementById(
            "loading"
        );


    const productSection =
        document.getElementById(
            "productSection"
        );


    const productError =
        document.getElementById(
            "productError"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const productImage =
        document.getElementById(
            "productImage"
        );


    const productThumbnails =
        document.getElementById(
            "productThumbnails"
        );


    const productName =
        document.getElementById(
            "productName"
        );


    const productPrice =
        document.getElementById(
            "productPrice"
        );


    const productCategory =
        document.getElementById(
            "productCategory"
        );


    const productDescription =
        document.getElementById(
            "productDescription"
        );


    const productStock =
        document.getElementById(
            "productStock"
        );


    const quantityElement =
        document.getElementById(
            "quantity"
        );


    const cartCount =
        document.getElementById(
            "cartCount"
        );


    /* ================= ERROR ================= */

    function showError(message) {

        loading.style.display =
            "none";


        productSection.style.display =
            "none";


        productError.style.display =
            "block";


        errorMessage.textContent =
            message;

    }


    /* ================= LOAD PRODUCT ================= */

    async function loadProduct() {

        try {

            console.log(
                "Product ID:",
                productId
            );


            if (!productId) {

                showError(
                    "Product ID URL में नहीं मिला."
                );

                return;

            }


            /*
                Firestore:

                products
                    ↓
                Fe79b830y1r2z2L4dPWM
            */

            const productRef =
                doc(
                    db,
                    "products",
                    productId
                );


            const productSnapshot =
                await getDoc(
                    productRef
                );


            console.log(
                "Firestore response:",
                productSnapshot.exists()
            );


            if (!productSnapshot.exists()) {

                showError(
                    "Firestore में यह product नहीं मिला."
                );

                return;

            }


            product = {

                id:
                    productSnapshot.id,

                ...productSnapshot.data()

            };


            console.log(
                "PRODUCT FOUND:",
                product
            );


            displayProduct();


        }
        catch (error) {

            console.error(
                "PRODUCT ERROR:",
                error
            );


            showError(
                "Product load नहीं हो पाया. Console में error देखें."
            );

        }

    }


    /* ================= DISPLAY ================= */

    function displayProduct() {

        loading.style.display =
            "none";


        productError.style.display =
            "none";


        productSection.style.display =
            "grid";


        /* NAME */

        productName.textContent =
            product.name ||
            "Premium Furniture";


        /* PRICE */

        const price =
            Number(
                product.price || 0
            );


        productPrice.textContent =
            price.toLocaleString(
                "en-IN"
            );


        /* CATEGORY */

        productCategory.textContent =
            String(
                product.category ||
                "Furniture"
            ).toUpperCase();


        /* DESCRIPTION */

        productDescription.textContent =
            product.description ||
            "Premium furniture crafted with quality and timeless design.";


        /* STOCK */

        const stock =
            Number(
                product.stock || 0
            );


        productStock.textContent =
            stock;


        /* ================= IMAGE ================= */

        let images = [];


        if (
            Array.isArray(
                product.images
            )
        ) {

            images =
                product.images.filter(
                    image =>
                        typeof image === "string" &&
                        image.trim() !== ""
                );

        }


        if (
            images.length === 0 &&
            typeof product.image === "string" &&
            product.image.trim() !== ""
        ) {

            images.push(
                product.image
            );

        }


        if (
            images.length === 0 &&
            typeof product.imageUrl === "string" &&
            product.imageUrl.trim() !== ""
        ) {

            images.push(
                product.imageUrl
            );

        }


        /* FALLBACK */

        if (images.length === 0) {

            images.push(
                "images/image1.jpg"
            );

        }


        product.images =
            images;


        /* MAIN IMAGE */

        productImage.src =
            images[0];


        productImage.alt =
            product.name ||
            "Product";


        /* IMAGE ERROR */

        productImage.onerror =
            function () {

                this.onerror =
                    null;

                this.src =
                    "images/image1.jpg";

            };


        /* THUMBNAILS */

        productThumbnails.innerHTML =
            "";


        images.forEach(
            (image, index) => {

                const thumbnail =
                    document.createElement(
                        "img"
                    );


                thumbnail.src =
                    image;


                thumbnail.alt =
                    "Product image " +
                    (index + 1);


                thumbnail.addEventListener(
                    "click",
                    function () {

                        productImage.src =
                            image;

                    }
                );


                thumbnail.onerror =
                    function () {

                        this.style.display =
                            "none";

                    };


                productThumbnails.appendChild(
                    thumbnail
                );

            }
        );


        quantity =
            1;


        quantityElement.textContent =
            quantity;


        updateCartCount();

    }


    /* ================= QUANTITY ================= */

    document
        .getElementById(
            "minusBtn"
        )
        .addEventListener(
            "click",
            function () {

                if (
                    quantity > 1
                ) {

                    quantity--;

                    quantityElement.textContent =
                        quantity;

                }

            }
        );


    document
        .getElementById(
            "plusBtn"
        )
        .addEventListener(
            "click",
            function () {

                if (!product) {
                    return;
                }


                const stock =
                    Number(
                        product.stock || 0
                    );


                if (
                    stock > 0 &&
                    quantity >= stock
                ) {

                    return;

                }


                quantity++;

                quantityElement.textContent =
                    quantity;

            }
        );


    /* ================= CART ================= */

    function getCart() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];

        }
        catch {

            return [];

        }

    }


    function updateCartCount() {

        const cart =
            getCart();


        const count =
            cart.reduce(
                (total, item) =>
                    total +
                    Number(
                        item.quantity || 0
                    ),
                0
            );


        if (cartCount) {

            cartCount.textContent =
                count;

        }

    }


    /* ================= ADD TO CART ================= */

    document
        .getElementById(
            "addCartBtn"
        )
        .addEventListener(
            "click",
            function () {

                if (!product) {
                    return;
                }


                const stock =
                    Number(
                        product.stock || 0
                    );


                if (stock <= 0) {

                    alert(
                        "This product is out of stock."
                    );

                    return;

                }


                let cart =
                    getCart();


                const existing =
                    cart.find(
                        item =>
                            String(item.id) ===
                            String(product.id)
                    );


                if (existing) {

                    existing.quantity =
                        Math.min(
                            Number(
                                existing.quantity || 0
                            ) + quantity,
                            stock
                        );


                }
                else {

                    cart.push({

                        id:
                            product.id,

                        name:
                            product.name ||
                            "Product",

                        price:
                            Number(
                                product.price || 0
                            ),

                        image:
                            product.images?.[0] ||
                            product.image ||
                            "",

                        quantity:
                            quantity

                    });

                }


                localStorage.setItem(
                    "cart",
                    JSON.stringify(cart)
                );


                updateCartCount();


                alert(
                    "Product added to cart!"
                );

            }
        );


    /* ================= WHATSAPP ================= */

    document
        .getElementById(
            "whatsappBtn"
        )
        .addEventListener(
            "click",
            function () {

                if (!product) {
                    return;
                }


                const phone =
                    "919509393894";


                const price =
                    Number(
                        product.price || 0
                    );


                const total =
                    price * quantity;


                const message =

                    "🛋️ SUPREME CRAFT INDIA ORDER\n\n"

                    + "Product: "
                    + (
                        product.name ||
                        "Product"
                    )

                    + "\n"

                    + "Product ID: "
                    + product.id

                    + "\n"

                    + "Quantity: "
                    + quantity

                    + "\n"

                    + "Total: ₹"
                    + total.toLocaleString(
                        "en-IN"
                    )

                    + "\n\n"

                    + "Please provide delivery details.";


                const url =
                    "https://wa.me/"
                    + phone
                    + "?text="
                    + encodeURIComponent(
                        message
                    );


                window.open(
                    url,
                    "_blank"
                );

            }
        );


    /* ================= START ================= */

    updateCartCount();

    loadProduct();

</script>


</body>

</html>
