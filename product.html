<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Product | Supreme Craft India
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ========================================
           PRODUCT DETAIL PAGE
        ======================================== */

        .product-detail {

            max-width: 1200px;

            margin: 70px auto;

            padding: 20px;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 60px;

        }


        /* ========================================
           IMAGE SECTION
        ======================================== */

        .detail-image {

            width: 100%;

        }


        .main-product-image {

            width: 100%;

            height: 520px;

            object-fit: contain;

            background: #f7f7f7;

            border-radius: 16px;

            display: block;

        }


        .product-thumbnails {

            display: flex;

            gap: 12px;

            margin-top: 15px;

            overflow-x: auto;

            padding-bottom: 5px;

        }


        .product-thumbnails img {

            width: 90px;

            height: 75px;

            object-fit: cover;

            border-radius: 8px;

            cursor: pointer;

            border: 2px solid transparent;

            flex-shrink: 0;

            transition: 0.2s;

        }


        .product-thumbnails img:hover {

            border-color: #222;

        }


        .product-thumbnails img.active {

            border-color: #111;

        }


        /* ========================================
           PRODUCT INFO
        ======================================== */

        .detail-info {

            padding-top: 10px;

        }


        .product-category {

            display: inline-block;

            font-size: 12px;

            letter-spacing: 2px;

            color: #777;

            font-weight: 600;

            margin-bottom: 12px;

        }


        .detail-info h1 {

            font-size: 42px;

            line-height: 1.15;

            margin: 0 0 18px;

            color: #111;

        }


        .detail-price {

            font-size: 30px;

            font-weight: 700;

            margin: 0 0 22px;

            color: #111;

        }


        .product-description {

            color: #555;

            line-height: 1.8;

            font-size: 16px;

            margin-bottom: 25px;

        }


        /* ========================================
           STOCK
        ======================================== */

        .stock {

            margin: 20px 0;

            font-size: 15px;

        }


        .stock strong {

            font-weight: 700;

        }


        .stock.available strong {

            color: #168000;

        }


        .stock.out strong {

            color: #d00000;

        }


        /* ========================================
           QUANTITY
        ======================================== */

        .quantity-title {

            display: block;

            font-weight: 600;

            margin-bottom: 10px;

        }


        .quantity-box {

            display: flex;

            align-items: center;

            gap: 0;

            margin: 10px 0 25px;

        }


        .quantity-box button {

            width: 45px;

            height: 45px;

            border: 1px solid #ddd;

            background: #fff;

            font-size: 22px;

            cursor: pointer;

        }


        .quantity-box button:hover {

            background: #f3f3f3;

        }


        .quantity-box span {

            width: 55px;

            height: 45px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-top: 1px solid #ddd;

            border-bottom: 1px solid #ddd;

            font-weight: 600;

        }


        /* ========================================
           BUTTONS
        ======================================== */

        .add-button,
        .whatsapp-button {

            width: 100%;

            min-height: 52px;

            padding: 14px 20px;

            margin-top: 10px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;

            transition: 0.2s;

        }


        .add-button {

            background: #111;

            color: white;

        }


        .add-button:hover {

            background: #333;

        }


        .whatsapp-button {

            background: #168000;

            color: white;

        }


        .whatsapp-button:hover {

            background: #116600;

        }


        .add-button:disabled,
        .whatsapp-button:disabled {

            background: #aaa;

            cursor: not-allowed;

        }


        /* ========================================
           LOADING
        ======================================== */

        .product-loading {

            min-height: 60vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px 20px;

        }


        .loading-spinner {

            width: 40px;

            height: 40px;

            border: 4px solid #ddd;

            border-top-color: #111;

            border-radius: 50%;

            animation:
                productSpin
                0.8s linear infinite;

            margin-bottom: 15px;

        }


        @keyframes productSpin {

            to {

                transform: rotate(360deg);

            }

        }


        /* ========================================
           PRODUCT NOT FOUND
        ======================================== */

        .product-error {

            min-height: 60vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px 20px;

        }


        .product-error h1 {

            margin-bottom: 10px;

        }


        .product-error p {

            color: #666;

        }


        .back-products {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 20px;

            background: #111;

            color: #fff;

            text-decoration: none;

            border-radius: 5px;

        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 768px) {

            .product-detail {

                grid-template-columns: 1fr;

                gap: 30px;

                margin: 30px auto;

                padding: 15px;

            }


            .main-product-image {

                height: 360px;

            }


            .detail-info h1 {

                font-size: 30px;

            }


            .detail-price {

                font-size: 25px;

            }


            .product-description {

                font-size: 15px;

            }

        }


        @media (max-width: 480px) {

            .main-product-image {

                height: 300px;

            }


            .product-thumbnails img {

                width: 75px;

                height: 62px;

            }


            .detail-info h1 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header>

    <div class="logo">

        SUPREME CRAFT
        <span>INDIA</span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a
            href="cart.html"
            class="cart-link"
        >

            🛒 Cart

            <span id="cartCount">
                0
            </span>

        </a>

    </nav>

</header>



<!-- ========================================
     PRODUCT AREA
======================================== -->

<main id="productPage">


    <!-- LOADING -->

    <div class="product-loading">

        <div class="loading-spinner"></div>

        <p>
            Loading product...
        </p>

    </div>


</main>



<!-- ========================================
     JAVASCRIPT
======================================== -->

<script type="module">

import {

    db,
    collection,
    getDocs

} from "./firebase.js";


// ========================================
// SETTINGS
// ========================================

const WHATSAPP_NUMBER =
    "919509393894";

const FALLBACK_IMAGE =
    "images/image1.jpg";


// ========================================
// GET PRODUCT ID FROM URL
// ========================================

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const productId =
    urlParams.get("id");


// ========================================
// GLOBAL VARIABLES
// ========================================

let product = null;

let quantity = 1;


// ========================================
// HTML ESCAPE
// ========================================

function escapeHTML(value = "") {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ========================================
// GET PRODUCT IMAGES
// ========================================

function getProductImages(product) {

    if (

        product &&
        Array.isArray(product.images) &&
        product.images.length > 0

    ) {

        return product.images;

    }


    if (

        product &&
        product.image

    ) {

        return [
            product.image
        ];

    }


    return [
        FALLBACK_IMAGE
    ];

}


// ========================================
// LOAD PRODUCT FROM FIRESTORE
// ========================================

async function loadProduct() {

    const page =
        document.getElementById(
            "productPage"
        );


    if (!productId) {

        showError(
            "Product ID is missing."
        );

        return;

    }


    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "products"
                )
            );


        const found =
            snapshot.docs.find(
                function(doc) {

                    return doc.id ===
                        productId;

                }
            );


        if (!found) {

            showError(
                "Product not found."
            );

            return;

        }


        product = {

            id:
                found.id,

            ...found.data()

        };


        renderProduct();

    } catch (error) {

        console.error(
            "Firestore product error:",
            error
        );


        showError(
            "Unable to load product. Please try again."
        );

    }

}


// ========================================
// RENDER PRODUCT
// ========================================

function renderProduct() {

    const page =
        document.getElementById(
            "productPage"
        );


    const images =
        getProductImages(
            product
        );


    const name =
        escapeHTML(
            product.name ||
            "Premium Furniture"
        );


    const category =
        escapeHTML(
            product.category ||
            "furniture"
        );


    const description =
        escapeHTML(
            product.description ||
            "Premium quality furniture."
        );


    const price =
        Number(
            product.price
        ) || 0;


    const stock =
        Number(
            product.stock
        ) || 0;


    const isAvailable =
        stock > 0;


    page.innerHTML = `

        <section class="product-detail">


            <!-- =================================
                 LEFT IMAGE
            ================================= -->

            <div class="detail-image">


                <img

                    id="mainProductImage"

                    class="main-product-image"

                    src="${escapeHTML(images[0])}"

                    alt="${name}"

                    onerror="
                        this.src='${FALLBACK_IMAGE}'
                    "

                >


                <div
                    id="productThumbnails"
                    class="product-thumbnails"
                ></div>


            </div>


            <!-- =================================
                 RIGHT INFO
            ================================= -->

            <div class="detail-info">


                <span
                    class="product-category"
                >

                    ${category.toUpperCase()}

                </span>


                <h1>

                    ${name}

                </h1>


                <p class="detail-price">

                    ₹${price.toLocaleString(
                        "en-IN"
                    )}

                </p>


                <p
                    class="product-description"
                >

                    ${description}

                </p>


                <p
                    class="stock ${
                        isAvailable
                        ? "available"
                        : "out"
                    }"
                >

                    Stock:

                    <strong
                        id="productStock"
                    >

                        ${
                            isAvailable
                            ? stock
                            : "Out of Stock"
                        }

                    </strong>

                </p>


                ${
                    isAvailable
                    ?

                    `

                    <label
                        class="quantity-title"
                    >

                        Quantity

                    </label>


                    <div
                        class="quantity-box"
                    >

                        <button
                            type="button"
                            id="minusBtn"
                        >

                            −

                        </button>


                        <span
                            id="quantity"
                        >

                            1

                        </span>


                        <button
                            type="button"
                            id="plusBtn"
                        >

                            +

                        </button>

                    </div>

                    `

                    :

                    ""

                }


                <button

                    type="button"

                    class="add-button"

                    id="addCartButton"

                    ${
                        !isAvailable
                        ? "disabled"
                        : ""
                    }

                >

                    🛒

                    ${
                        isAvailable
                        ? "Add to Cart"
                        : "Out of Stock"
                    }

                </button>


                <button

                    type="button"

                    class="whatsapp-button"

                    id="whatsappButton"

                    ${
                        !isAvailable
                        ? "disabled"
                        : ""
                    }

                >

                    📱 Buy on WhatsApp

                </button>


            </div>


        </section>

    `;


    createThumbnails(
        images
    );


    if (isAvailable) {

        document
            .getElementById(
                "minusBtn"
            )
            .addEventListener(
                "click",
                function() {

                    changeQty(-1);

                }
            );


        document
            .getElementById(
                "plusBtn"
            )
            .addEventListener(
                "click",
                function() {

                    changeQty(1);

                }
            );


        document
            .getElementById(
                "addCartButton"
            )
            .addEventListener(
                "click",
                addProductToCart
            );


        document
            .getElementById(
                "whatsappButton"
            )
            .addEventListener(
                "click",
                buyOnWhatsApp
            );

    }

}


// ========================================
// PRODUCT THUMBNAILS
// ========================================

function createThumbnails(
    images
) {

    const container =
        document.getElementById(
            "productThumbnails"
        );


    if (!container) {

        return;

    }


    container.innerHTML =
        "";


    images.forEach(
        function(image, index) {

            const thumbnail =
                document.createElement(
                    "img"
                );


            thumbnail.src =
                image;


            thumbnail.alt =
                "Product photo " +
                (index + 1);


            if (
                index === 0
            ) {

                thumbnail.classList.add(
                    "active"
                );

            }


            thumbnail.onerror =
                function() {

                    this.src =
                        FALLBACK_IMAGE;

                };


            thumbnail.addEventListener(
                "click",
                function() {

                    const mainImage =
                        document.getElementById(
                            "mainProductImage"
                        );


                    if (mainImage) {

                        mainImage.src =
                            image;

                    }


                    container
                        .querySelectorAll(
                            "img"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    thumbnail.classList.add(
                        "active"
                    );

                }
            );


            container.appendChild(
                thumbnail
            );

        }
    );

}


// ========================================
// QUANTITY
// ========================================

function changeQty(
    amount
) {

    if (!product) {

        return;

    }


    const stock =
        Number(
            product.stock
        ) || 0;


    quantity +=
        amount;


    if (
        quantity < 1
    ) {

        quantity = 1;

    }


    if (
        quantity > stock
    ) {

        quantity = stock;

    }


    const quantityElement =
        document.getElementById(
            "quantity"
        );


    if (quantityElement) {

        quantityElement.innerText =
            quantity;

    }

}


// ========================================
// GET CART
// ========================================

function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "cart"
            )
        ) || [];

    } catch {

        return [];

    }

}


// ========================================
// SAVE CART
// ========================================

function saveCart(cart) {

    localStorage.setItem(
        "cart",
        JSON.stringify(
            cart
        )
    );


    updateCartCount();

}


// ========================================
// ADD PRODUCT TO CART
// ========================================

function addProductToCart() {

    if (!product) {

        return;

    }


    const stock =
        Number(
            product.stock
        ) || 0;


    if (
        stock <= 0
    ) {

        alert(
            "This product is out of stock."
        );

        return;

    }


    const cart =
        getCart();


    const existingProduct =
        cart.find(
            function(item) {

                return item.productId ===
                    product.id;

            }
        );


    if (existingProduct) {

        existingProduct.quantity =
            Math.min(
                Number(
                    existingProduct.quantity
                ) + quantity,
                stock
            );

    } else {

        const images =
            getProductImages(
                product
            );


        cart.push({

            productId:
                product.id,

            name:
                product.name ||
                "Premium Furniture",

            price:
                Number(
                    product.price
                ) || 0,

            image:
                images[0],

            quantity:
                Math.min(
                    quantity,
                    stock
                )

        });

    }


    saveCart(cart);


    alert(

        product.name +
        " added to cart!"

    );

}


// ========================================
// CART COUNT
// ========================================

function updateCartCount() {

    const cart =
        getCart();


    const totalItems =
        cart.reduce(
            function(total, item) {

                return total +
                    Number(
                        item.quantity || 0
                    );

            },
            0
        );


    document
        .querySelectorAll(
            "#cartCount"
        )
        .forEach(
            function(element) {

                element.innerText =
                    totalItems;

            }
        );

}


// ========================================
// WHATSAPP
// ========================================

function buyOnWhatsApp() {

    if (!product) {

        return;

    }


    const total =
        Number(
            product.price
        ) *
        quantity;


    const message =

        "Hello Supreme Craft India,\n\n" +

        "I want to order:\n\n" +

        "Product: " +
        product.name +
        "\n" +

        "Quantity: " +
        quantity +
        "\n" +

        "Price: ₹" +
        total.toLocaleString(
            "en-IN"
        ) +

        "\n\n" +

        "Please provide more details.";


    const whatsappURL =

        "https://wa.me/" +

        WHATSAPP_NUMBER +

        "?text=" +

        encodeURIComponent(
            message
        );


    window.open(
        whatsappURL,
        "_blank"
    );

}


// ========================================
// PRODUCT ERROR
// ========================================

function showError(
    message
) {

    const page =
        document.getElementById(
            "productPage"
        );


    page.innerHTML = `

        <div class="product-error">

            <h1>
                Product Not Found
            </h1>

            <p>
                ${escapeHTML(message)}
            </p>

            <a
                href="index.html#products"
                class="back-products"
            >

                ← Back to Products

            </a>

        </div>

    `;

}


// ========================================
// START
// ========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateCartCount();

        loadProduct();

    }
);

</script>


</body>

</html>
