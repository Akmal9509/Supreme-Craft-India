<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | Supreme Craft India</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ========================================
           CART PAGE
        ======================================== */

        .cart-page {
            max-width: 1200px;
            margin: 60px auto;
            padding: 20px;
        }

        .cart-page-header {
            margin-bottom: 35px;
        }

        .cart-page-header .small-title {
            margin-bottom: 8px;
        }

        .cart-page-header h1 {
            font-size: 42px;
            margin: 0;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 35px;
            align-items: start;
        }

        /* ========================================
           CART ITEMS
        ======================================== */

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 18px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
        }

        .cart-item-image {
            width: 110px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .cart-item-info h3 {
            margin: 0 0 7px;
            font-size: 19px;
        }

        .cart-item-price {
            font-size: 16px;
            color: #555;
            margin-bottom: 12px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-control button {
            width: 34px;
            height: 34px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity-control button:hover {
            background: #f1f1f1;
        }

        .quantity-value {
            min-width: 25px;
            text-align: center;
            font-weight: 600;
        }

        .cart-item-total {
            text-align: right;
        }

        .cart-item-total strong {
            display: block;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .remove-btn {
            border: none;
            background: #d00000;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .remove-btn:hover {
            opacity: 0.85;
        }

        /* ========================================
           SUMMARY
        ======================================== */

        .cart-summary {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 25px;
            position: sticky;
            top: 20px;
        }

        .cart-summary h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
        }

        .summary-total {
            border-top: 1px solid #ddd;
            margin-top: 10px;
            padding-top: 18px;
            font-size: 21px;
            font-weight: 700;
        }

        .checkout-btn {
            width: 100%;
            border: none;
            padding: 15px;
            margin-top: 20px;
            background: #168000;
            color: white;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        .continue-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            margin-top: 12px;
            padding: 13px;
            border: 1px solid #222;
            color: #222;
            border-radius: 7px;
        }

        /* ========================================
           EMPTY CART
        ======================================== */

        .empty-cart {
            text-align: center;
            padding: 70px 20px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fafafa;
        }

        .empty-cart-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #666;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        /* ========================================
           HEADER CART COUNT
        ======================================== */

        #cartCount {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            background: #222;
            color: white;
            border-radius: 20px;
            font-size: 12px;
        }

        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 800px) {

            .cart-page {
                margin: 30px auto;
                padding: 15px;
            }

            .cart-page-header h1 {
                font-size: 32px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

        }

        @media (max-width: 600px) {

            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 12px;
            }

            .cart-item-image {
                width: 80px;
                height: 75px;
            }

            .cart-item-info h3 {
                font-size: 16px;
            }

            .cart-item-total {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-top: 1px solid #eee;
                padding-top: 12px;
            }

            .cart-item-total strong {
                margin: 0;
            }

        }

    </style>

</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header class="site-header">

    <div class="logo">
        SUPREME CRAFT <span>INDIA</span>
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="index.html#about">
            About
        </a>

        <a href="index.html#contact">
            Contact
        </a>

        <a href="cart.html" class="cart-link">
            🛒 Cart
            <span id="cartCount">0</span>
        </a>

    </nav>

</header>


<!-- ========================================
     CART
======================================== -->

<main class="cart-page">


    <div class="cart-page-header">

        <p class="small-title">
            YOUR SHOPPING CART
        </p>

        <h1>
            Your Cart
        </h1>

    </div>


    <!-- CART CONTENT -->

    <div
        id="cartContent"
        class="cart-layout"
    >

        <!-- ITEMS -->

        <div
            id="cartItems"
            class="cart-items"
        ></div>


        <!-- SUMMARY -->

        <aside
            id="cartSummary"
            class="cart-summary"
        >

            <h2>
                Order Summary
            </h2>

            <div class="summary-row">

                <span>
                    Items
                </span>

                <span id="summaryItems">
                    0
                </span>

            </div>

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span>
                    ₹<span id="summarySubtotal">0</span>
                </span>

            </div>

            <div class="summary-row">

                <span>
                    Shipping
                </span>

                <span>
                    To be calculated
                </span>

            </div>

            <div class="summary-row summary-total">

                <span>
                    Total
                </span>

                <span>
                    ₹<span id="summaryTotal">0</span>
                </span>

            </div>

            <button
                class="checkout-btn"
                onclick="checkoutWhatsApp()"
            >
                📱 Order on WhatsApp
            </button>

            <a
                href="index.html#products"
                class="continue-btn"
            >
                Continue Shopping
            </a>

        </aside>

    </div>

</main>


<!-- ========================================
     FOOTER
======================================== -->

<footer>

    <h3>
        SUPREME CRAFT INDIA
    </h3>

    <p>
        Premium Furniture • Crafted with Excellence
    </p>

    <p>
        © 2026 Supreme Craft India
    </p>

</footer>


<!-- ========================================
     SCRIPT
======================================== -->

<script>

"use strict";


/* ========================================
   GET CART
======================================== */

function getCart() {

    try {

        const cart =
            JSON.parse(
                localStorage.getItem("cart")
            );

        return Array.isArray(cart)
            ? cart
            : [];

    } catch (error) {

        console.error(
            "Cart data error:",
            error
        );

        return [];

    }

}


/* ========================================
   SAVE CART
======================================== */

function saveCart(cart) {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


/* ========================================
   FORMAT PRICE
======================================== */

function formatPrice(price) {

    return Number(
        price || 0
    ).toLocaleString("en-IN");

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ========================================
   UPDATE CART COUNT
======================================== */

function updateCartCount() {

    const cart =
        getCart();

    const totalItems =
        cart.reduce(
            function(total, item) {

                return total +
                    Math.max(
                        0,
                        Number(item.quantity) || 0
                    );

            },
            0
        );


    const count =
        document.getElementById(
            "cartCount"
        );


    if (count) {

        count.innerText =
            totalItems;

    }

}


/* ========================================
   RENDER CART
======================================== */

function renderCart() {

    const cart =
        getCart();


    const itemsContainer =
        document.getElementById(
            "cartItems"
        );


    const summary =
        document.getElementById(
            "cartSummary"
        );


    if (!itemsContainer) {
        return;
    }


    /* EMPTY CART */

    if (cart.length === 0) {

        itemsContainer.innerHTML = `

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🛒
                </div>

                <h2>
                    Your Cart is Empty
                </h2>

                <p>
                    Add some premium furniture
                    to your cart.
                </p>

                <a
                    href="index.html#products"
                    class="shop-btn"
                >
                    Explore Products
                </a>

            </div>

        `;


        if (summary) {

            summary.style.display =
                "none";

        }


        updateCartCount();

        return;

    }


    if (summary) {

        summary.style.display =
            "block";

    }


    let subtotal = 0;

    let totalItems = 0;


    itemsContainer.innerHTML = "";


    cart.forEach(
        function(item, index) {

            const name =
                item.name ||
                "Premium Furniture";


            const price =
                Number(item.price) || 0;


            const quantity =
                Math.max(
                    1,
                    Number(item.quantity) || 1
                );


            const itemTotal =
                price * quantity;


            subtotal +=
                itemTotal;


            totalItems +=
                quantity;


            /*
             * Old cart items may not have
             * an image. Use a safe fallback.
             */

            const image =
                item.image ||
                "images/image1.jpg";


            itemsContainer.innerHTML += `

                <div class="cart-item">

                    <img
                        class="cart-item-image"
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(name)}"
                        onerror="
                            this.src='images/image1.jpg'
                        "
                    >

                    <div class="cart-item-info">

                        <h3>
                            ${escapeHTML(name)}
                        </h3>

                        <div class="cart-item-price">

                            ₹${formatPrice(price)}
                            each

                        </div>

                        <div class="quantity-control">

                            <button
                                type="button"
                                onclick="changeCartQuantity(${index}, -1)"
                            >
                                −
                            </button>

                            <span class="quantity-value">
                                ${quantity}
                            </span>

                            <button
                                type="button"
                                onclick="changeCartQuantity(${index}, 1)"
                            >
                                +
                            </button>

                        </div>

                    </div>

                    <div class="cart-item-total">

                        <strong>
                            ₹${formatPrice(itemTotal)}
                        </strong>

                        <button
                            type="button"
                            class="remove-btn"
                            onclick="removeCartItem(${index})"
                        >
                            🗑️ Remove
                        </button>

                    </div>

                </div>

            `;

        }
    );


    document.getElementById(
        "summaryItems"
    ).innerText =
        totalItems;


    document.getElementById(
        "summarySubtotal"
    ).innerText =
        formatPrice(subtotal);


    document.getElementById(
        "summaryTotal"
    ).innerText =
        formatPrice(subtotal);


    updateCartCount();

}


/* ========================================
   CHANGE QUANTITY
======================================== */

function changeCartQuantity(
    index,
    change
) {

    const cart =
        getCart();


    if (!cart[index]) {
        return;
    }


    let quantity =
        Number(
            cart[index].quantity
        ) || 1;


    quantity +=
        Number(change) || 0;


    if (quantity <= 0) {

        removeCartItem(index);

        return;

    }


    cart[index].quantity =
        quantity;


    saveCart(cart);

    renderCart();

}


/* ========================================
   REMOVE ITEM
======================================== */

function removeCartItem(index) {

    const cart =
        getCart();


    if (!cart[index]) {
        return;
    }


    const productName =
        cart[index].name ||
        "this product";


    const confirmed =
        confirm(
            "Kya aap \"" +
            productName +
            "\" ko cart se remove karna chahte hain?"
        );


    if (!confirmed) {
        return;
    }


    cart.splice(
        index,
        1
    );


    saveCart(cart);

    renderCart();

}


/* ========================================
   CLEAR CART
======================================== */

function clearCart() {

    const cart =
        getCart();


    if (cart.length === 0) {
        return;
    }


    const confirmed =
        confirm(
            "Kya aap poora cart clear karna chahte hain?"
        );


    if (!confirmed) {
        return;
    }


    localStorage.removeItem(
        "cart"
    );


    renderCart();

}


/* ========================================
   WHATSAPP CHECKOUT
======================================== */

function checkoutWhatsApp() {

    const cart =
        getCart();


    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    const phoneNumber =
        "919509393894";


    let total = 0;

    let message =
        "Hello Supreme Craft India,\n\n" +
        "I want to order the following products:\n\n";


    cart.forEach(
        function(item, index) {

            const name =
                item.name ||
                "Premium Furniture";


            const price =
                Number(item.price) || 0;


            const quantity =
                Math.max(
                    1,
                    Number(item.quantity) || 1
                );


            const itemTotal =
                price * quantity;


            total +=
                itemTotal;


            message +=
                (index + 1) +
                ". " +
                name +
                "\n" +

                "Quantity: " +
                quantity +
                "\n" +

                "Price: ₹" +
                formatPrice(price) +
                "\n" +

                "Total: ₹" +
                formatPrice(itemTotal) +
                "\n\n";

        }
    );


    message +=
        "Grand Total: ₹" +
        formatPrice(total) +
        "\n\n" +

        "Please provide more details about delivery and payment.";


    const whatsappURL =
        "https://wa.me/" +
        phoneNumber +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        whatsappURL,
        "_blank",
        "noopener,noreferrer"
    );

}


/* ========================================
   START
======================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderCart();

        updateCartCount();

    }
);

</script>


</body>

</html>
